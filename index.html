                value="${escapeHTML(appState.studentName)}"
                data-action="edit-student-name"
                class="text-xs font-bold px-3 py-1.5 rounded-xl border border-slate-200 bg-slate-50 focus:bg-white focus:border-[#FF5A36] focus:outline-none w-40"
              />
              <div class="inline-flex rounded-xl bg-slate-100 p-1">
                <button
                  type="button"
                  data-action="set-audience-tab"
                  data-tab="vote"
                  class="px-3 py-1 rounded-lg text-xs font-extrabold ${appState.audienceSubTab === 'vote' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}"
                >Vota</button>
                <button
                  type="button"
                  data-action="set-audience-tab"
                  data-tab="qa"
                  class="px-3 py-1 rounded-lg text-xs font-extrabold ${appState.audienceSubTab === 'qa' ? 'bg-white text-slate-900 shadow-sm' : 'text-slate-500'}"
                >Domande (${qaList.length})</button>
              </div>
            </div>

            <!-- Contenuto Principale -->
            <main class="flex-1 p-4 overflow-y-auto">
              ${appState.audienceSubTab === 'vote'
                ? renderStudentSlideForm(room, slide, participantDeviceId, appState.studentName || 'Studente', false)
                : `
                  <div class="space-y-4">
                    <form data-action="submit-qa-form" class="bg-white p-4 rounded-2xl border border-slate-200 space-y-2.5">
                      <label class="block text-xs font-extrabold uppercase tracking-wider text-slate-500">Fai una domanda all’insegnante</label>
                      <textarea
                        name="qaText"
                        rows="2"
                        maxlength="180"
                        placeholder="Scrivi qui il tuo dubbio o la tua domanda..."
                        class="w-full p-3 rounded-xl border border-slate-200 text-sm font-medium focus:border-[#FF5A36] focus:outline-none"
                      ></textarea>
                      <button type="submit" class="btn-tactile w-full py-2.5 rounded-xl bg-slate-900 text-white font-bold text-sm">
                        Invia Domanda
                      </button>
                    </form>

                    <div class="space-y-2.5">
                      ${qaList.map(q => {
                        const liked = (q.upvotedBy || []).includes(participantDeviceId);
                        return `
                          <div class="p-3.5 rounded-2xl bg-white border border-slate-200 flex items-start justify-between gap-3">
                            <div>
                              <p class="text-sm font-bold text-slate-900">${escapeHTML(q.text)}</p>
                              <span class="text-[11px] text-slate-500">Da: ${escapeHTML(q.author)}</span>
                            </div>
                            <button
                              type="button"
                              data-action="upvote-qa"
                              data-qaid="${escapeHTML(q.id)}"
                              class="px-2.5 py-1.5 rounded-xl border text-xs font-extrabold shrink-0 ${
                                liked ? 'bg-amber-200 border-amber-400 text-slate-950' : 'bg-slate-50 border-slate-200 text-slate-600'
                              }"
                            >👍 ${q.upvotes || 0}</button>
                          </div>
                        `;
                      }).join('')}
                    </div>
                  </div>
                `}
            </main>

            <!-- Barra Reazioni Fissa in Basso -->
            <footer class="bg-white border-t border-slate-200 px-4 py-2.5 flex items-center justify-around sticky bottom-0 z-20">
              ${REACTION_EMOJIS.map(em => `
                <button
                  type="button"
                  data-action="send-reaction"
                  data-emoji="${em}"
                  class="w-11 h-11 rounded-2xl bg-slate-50 hover:bg-orange-50 active:scale-125 transition text-xl flex items-center justify-center border border-slate-200/70"
                >${em}</button>
              `).join('')}
            </footer>
          </div>
        `;
      }

      // =========================================================================
      // 11. SMART RENDERING CON PRESERVAZIONE DEL FOCUS E DEL CURSORE
      // =========================================================================
      function renderApp() {
        applyGlobalFontScale();
        const root = document.getElementById('app');
        if (!root) return;

        // Salva stato focus corrente prima di aggiornare il DOM
        const activeEl = document.activeElement;
        let focusSelector = null;
        let selStart = null;
        let selEnd = null;

        if (activeEl && root.contains(activeEl) && (activeEl.tagName === 'INPUT' || activeEl.tagName === 'TEXTAREA')) {
          if (activeEl.dataset.action === 'edit-room-title') {
            focusSelector = '[data-action="edit-room-title"]';
          } else if (activeEl.dataset.action === 'edit-slide-field' && activeEl.dataset.field) {
            focusSelector = `[data-action="edit-slide-field"][data-field="${activeEl.dataset.field}"]`;
          } else if (activeEl.dataset.action === 'edit-option-text' && activeEl.dataset.optionId) {
            focusSelector = `[data-action="edit-option-text"][data-option-id="${activeEl.dataset.optionId}"]`;
          } else if (activeEl.dataset.action === 'edit-statement-text' && activeEl.dataset.stid) {
            focusSelector = `[data-action="edit-statement-text"][data-stid="${activeEl.dataset.stid}"]`;
          } else if (activeEl.dataset.action === 'edit-rank-item' && activeEl.dataset.itemId) {
            focusSelector = `[data-action="edit-rank-item"][data-item-id="${activeEl.dataset.itemId}"]`;
          } else if (activeEl.dataset.draftKey && activeEl.dataset.wordIndex !== undefined) {
            focusSelector = `[data-draft-key="${activeEl.dataset.draftKey}"][data-word-index="${activeEl.dataset.wordIndex}"]`;
          } else if (activeEl.dataset.openDraft) {
            focusSelector = `[data-open-draft="${activeEl.dataset.openDraft}"]`;
          } else if (activeEl.dataset.action === 'edit-student-name') {
            focusSelector = '[data-action="edit-student-name"]';
          }
          try {
            selStart = activeEl.selectionStart;
            selEnd = activeEl.selectionEnd;
          } catch (_) {}
        }

        let html = '';
        if (appState.view === 'home') {
          html = renderHomeView();
        } else if (appState.view === 'editor') {
          html = renderEditorView();
        } else if (appState.view === 'stage') {
          html = renderStageView();
        } else if (appState.view === 'audience') {
          html = renderAudienceView();
        }

        root.innerHTML = html;

        // Ripristina focus e posizione cursore se l'utente stava digitando
        if (focusSelector) {
          const restored = root.querySelector(focusSelector);
          if (restored) {
            restored.focus();
            if (typeof selStart === 'number' && typeof restored.setSelectionRange === 'function') {
              try { restored.setSelectionRange(selStart, selEnd); } catch (_) {}
            }
          }
        }

        initWordCloudObserver();
      }

      // =========================================================================
      // 12. MODALI (QR Code & Spotlight Post-it) E GESTIONE EVENTI UNIFICATA
      // =========================================================================
      function openModal(innerHtml) {
        const modal = document.getElementById('modal-container');
        if (!modal) return;
        modal.innerHTML = innerHtml;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }

      function closeModal() {
        const modal = document.getElementById('modal-container');
        if (!modal) return;
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        modal.innerHTML = '';
      }

      function openQrModal(code) {
        const baseUrl = window.location.href.split('#')[0];
        const joinUrl = `${baseUrl}#join=${code}`;
        const qrSvg = generateLocalQRSVG(joinUrl, 210);

        openModal(`
          <div class="bg-white rounded-3xl max-w-md w-full p-6 sm:p-8 shadow-2xl text-center space-y-5 animate-pop-in relative">
            <button type="button" data-action="close-modal" class="absolute top-4 right-4 w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 font-black text-slate-700">✕</button>
            <div>
              <span class="inline-block px-3 py-1 rounded-xl bg-orange-100 text-[#FF5A36] text-xs font-extrabold uppercase tracking-wider mb-2">
                Accesso Smartphone Studenti
              </span>
              <h3 class="font-display font-black text-2xl text-slate-900">Inquadra il QR Code</h3>
              <p class="text-sm text-slate-600 mt-1">Oppure apri il sito e digita il codice stanza:</p>
            </div>

            ${qrSvg}

            <div class="p-3.5 rounded-2xl bg-slate-900 text-amber-300 font-display font-black text-3xl tracking-[0.25em]">
              ${escapeHTML(code)}
            </div>

            <div class="flex items-center gap-2">
              <input id="qr-join-link" type="text" readonly value="${escapeHTML(joinUrl)}" class="flex-1 px-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50 text-xs font-mono text-slate-700" />
              <button type="button" data-action="copy-join-link" class="btn-tactile px-4 py-2.5 rounded-xl bg-[#FF5A36] text-white font-bold text-xs flex items-center gap-1.5 shrink-0">
                ${getIcon('copy', 'w-3.5 h-3.5')} Copia Link
              </button>
            </div>
          </div>
        `);
      }

      function navigateTo(view, code = null) {
        appState.view = view;
        appState.roomCode = code;

        if (view === 'home') {
          store.sync.stop();
          try { history.replaceState(null, '', window.location.pathname + window.location.search); } catch (_) {}
        } else if (view === 'editor' || view === 'stage') {
          store.sync.startHost(code);
        } else if (view === 'audience') {
          store.sync.connectClient(code);
          try { history.replaceState(null, '', `#join=${code}`); } catch (_) {}
        }
        renderApp();
      }

      // Event Delegation Globale (Click, Input, Change, Submit, Keyboard)
      document.addEventListener('click', (e) => {
        const modal = document.getElementById('modal-container');
        if (modal && !modal.classList.contains('hidden') && e.target === modal) {
          closeModal();
          return;
        }

        const btn = e.target.closest('[data-action]');
        if (!btn) {
          const dd = document.getElementById('add-slide-dropdown');
          if (dd && !dd.classList.contains('hidden') && !e.target.closest('#add-slide-dropdown')) {
            dd.classList.add('hidden');
          }
          return;
        }

        const action = btn.dataset.action;

        if (action === 'close-modal') {
          closeModal();
        } else if (action === 'go-home') {
          navigateTo('home');
        } else if (action === 'create-room') {
          const room = store.createRoom();
          navigateTo('editor', room.code);
        } else if (action === 'open-demo') {
          const demoCode = store.rooms['482910'] ? '482910' : Object.keys(store.rooms)[0];
          navigateTo('stage', demoCode);
        } else if (action === 'create-template') {
          const room = store.createFromTemplate(btn.dataset.template);
          navigateTo('editor', room.code);
        } else if (action === 'delete-room') {
          store.deleteRoom(btn.dataset.code);
          showToast('Lezione eliminata', 'info');
        } else if (action === 'open-editor') {
          navigateTo('editor', btn.dataset.code);
        } else if (action === 'open-stage') {
          navigateTo('stage', btn.dataset.code);
        } else if (action === 'show-qr-modal') {
          if (appState.roomCode) openQrModal(appState.roomCode);
        } else if (action === 'copy-join-link') {
          const inp = document.getElementById('qr-join-link');
          if (inp) {
            inp.select();
            try {
              document.execCommand('copy');
              showToast('Link copiato negli appunti!', 'success');
            } catch (_) {
              showToast('Seleziona e copia il link manualmente', 'warning');
            }
          }
        } else if (action === 'toggle-phone-sim') {
          appState.showPhoneSim = !appState.showPhoneSim;
          renderApp();
        } else if (action === 'toggle-qa-drawer') {
          appState.showQaDrawer = !appState.showQaDrawer;
          renderApp();
        } else if (action === 'toggle-fullscreen') {
          if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen?.().catch(() => {});
          } else {
            document.exitFullscreen?.().catch(() => {});
          }
        } else if (action === 'set-font-scale') {
          appState.fontScale = Number(btn.dataset.scale || 0);
          renderApp();
        } else if (action === 'set-editor-tab') {
          appState.editorTab = btn.dataset.tab;
          renderApp();
        } else if (action === 'set-mobile-pane') {
          appState.mobileEditorPane = btn.dataset.pane;
          renderApp();
        } else if (action === 'set-audience-tab') {
          appState.audienceSubTab = btn.dataset.tab;
          renderApp();
        } else if (action === 'reconnect-client') {
          if (appState.roomCode) {
            store.sync.connectClient(appState.roomCode);
            showToast('Riconnessione in corso...', 'info');
          }
        } else if (action === 'toggle-add-slide-menu') {
          const dd = document.getElementById('add-slide-dropdown');
          if (dd) dd.classList.toggle('hidden');
        } else if (action === 'add-slide') {
          const type = btn.dataset.slideType;
          appState.mobileEditorPane = 'edit';
          store.updateRoom(appState.roomCode, (r) => {
            const newSl = createSlideTemplate(type);
            r.slides.push(newSl);
            r.activeSlideIndex = r.slides.length - 1;
          });
        } else if (action === 'select-slide') {
          const idx = Number(btn.dataset.index || 0);
          appState.mobileEditorPane = 'edit';
          store.updateRoom(appState.roomCode, (r) => {
            r.activeSlideIndex = idx;
          });
        } else if (action === 'move-slide') {
          e.stopPropagation();
          const idx = Number(btn.dataset.index);
          const dir = Number(btn.dataset.dir);
          store.updateRoom(appState.roomCode, (r) => {
            const target = idx + dir;
            if (target < 0 || target >= r.slides.length) return;
            const tmp = r.slides[idx];
            r.slides[idx] = r.slides[target];
            r.slides[target] = tmp;
            r.activeSlideIndex = target;
          });
        } else if (action === 'delete-slide') {
          e.stopPropagation();
          const idx = Number(btn.dataset.index);
          store.updateRoom(appState.roomCode, (r) => {
            if (r.slides.length <= 1) return;
            r.slides.splice(idx, 1);
            r.activeSlideIndex = Math.min(r.activeSlideIndex, r.slides.length - 1);
          });
        } else if (action === 'prev-slide') {
          store.updateRoom(appState.roomCode, (r) => {
            r.activeSlideIndex = Math.max(0, (r.activeSlideIndex || 0) - 1);
          });
        } else if (action === 'next-slide') {
          store.updateRoom(appState.roomCode, (r) => {
            r.activeSlideIndex = Math.min(r.slides.length - 1, (r.activeSlideIndex || 0) + 1);
          });
        } else if (action === 'set-theme') {
          store.updateRoom(appState.roomCode, (r) => {
            r.theme = btn.dataset.theme;
          });
        } else if (action === 'set-chart-type') {
          store.updateRoom(appState.roomCode, (r) => {
            const sl = r.slides[r.activeSlideIndex];
            if (sl) sl.chartType = btn.dataset.chart;
          });
        } else if (action === 'undo-wc-merge') {
          undoLastWordMerge();
        } else if (action === 'reset-slide-responses') {
          store.updateRoom(appState.roomCode, (r) => {
            const sl = r.slides[r.activeSlideIndex];
            if (sl) {
              sl.responses = {};
              if (sl.type === 'wordcloud') {
                sl.wordAliases = {};
                sl.mergeHistory = [];
              }
              if (sl.type === 'quiz') {
                sl.status = 'waiting';
                sl.timeLeft = sl.duration || 25;
              }
            }
          });
          showToast('Risposte azzerate per questa slide', 'info');
        } else if (action === 'add-option') {
          store.updateRoom(appState.roomCode, (r) => {
            const sl = r.slides[r.activeSlideIndex];
            if (sl && sl.options) {
              sl.options.push({ id: uid('opt'), text: `Opzione ${sl.options.length + 1}` });
            }
          });
        } else if (action === 'remove-option') {
          const optId = btn.dataset.optionId;
          store.updateRoom(appState.roomCode, (r) => {
            const sl = r.slides[r.activeSlideIndex];
            if (sl && sl.options && sl.options.length > 2) {
              sl.options = sl.options.filter(o => o.id !== optId);
            }
          });
        } else if (action === 'add-statement') {
          store.updateRoom(appState.roomCode, (r) => {
            const sl = r.slides[r.activeSlideIndex];
            if (sl && sl.statements) {
              sl.statements.push({ id: uid('st'), text: `Nuova affermazione ${sl.statements.length + 1}` });
            }
          });
        } else if (action === 'remove-statement') {
          const stId = btn.dataset.stid;
          store.updateRoom(appState.roomCode, (r) => {
            const sl = r.slides[r.activeSlideIndex];
            if (sl && sl.statements && sl.statements.length > 1) {
              sl.statements = sl.statements.filter(s => s.id !== stId);
            }
          });
        } else if (action === 'add-rank-item') {
          store.updateRoom(appState.roomCode, (r) => {
            const sl = r.slides[r.activeSlideIndex];
            if (sl && sl.items) {
              sl.items.push({ id: uid('rk'), text: `Elemento ${sl.items.length + 1}` });
            }
          });
        } else if (action === 'remove-rank-item') {
          const itemId = btn.dataset.itemId;
          store.updateRoom(appState.roomCode, (r) => {
            const sl = r.slides[r.activeSlideIndex];
            if (sl && sl.items && sl.items.length > 2) {
              sl.items = sl.items.filter(i => i.id !== itemId);
            }
          });
        } else if (action === 'toggle-quiz-correct') {
          const optId = btn.dataset.optionId;
          store.updateRoom(appState.roomCode, (r) => {
            const sl = r.slides[r.activeSlideIndex];
            if (sl && sl.options) {
              sl.options.forEach(o => { o.isCorrect = o.id === optId; });
            }
          });
        } else if (action === 'quiz-start') {
          store.updateRoom(appState.roomCode, (r) => {
            const sl = r.slides[r.activeSlideIndex];
            if (sl && sl.type === 'quiz') {
              sl.timeLeft = sl.duration || 25;
              sl.status = 'running';
            }
          });
        } else if (action === 'quiz-pause') {
          store.updateRoom(appState.roomCode, (r) => {
            const sl = r.slides[r.activeSlideIndex];
            if (sl && sl.type === 'quiz') sl.status = 'paused';
          });
        } else if (action === 'quiz-resume') {
          store.updateRoom(appState.roomCode, (r) => {
            const sl = r.slides[r.activeSlideIndex];
            if (sl && sl.type === 'quiz') sl.status = 'running';
          });
        } else if (action === 'quiz-end') {
          store.updateRoom(appState.roomCode, (r) => {
            const sl = r.slides[r.activeSlideIndex];
            if (sl && sl.type === 'quiz') {
              sl.timeLeft = 0;
              sl.status = 'ended';
            }
          });
        } else if (action === 'quiz-reset') {
          store.updateRoom(appState.roomCode, (r) => {
            const sl = r.slides[r.activeSlideIndex];
            if (sl && sl.type === 'quiz') {
              sl.responses = {};
              sl.timeLeft = sl.duration || 25;
              sl.status = 'waiting';
            }
          });
        } else if (action === 'open-spotlight') {
          const text = btn.dataset.text || '';
          const author = btn.dataset.author || 'Studente';
          openModal(`
            <div class="bg-white rounded-3xl max-w-xl w-full p-8 shadow-2xl border-t-8 border-t-[#FF5A36] space-y-5 animate-pop-in relative">
              <button type="button" data-action="close-modal" class="absolute top-4 right-4 w-9 h-9 rounded-xl bg-slate-100 hover:bg-slate-200 font-black">✕</button>
              <span class="inline-block px-3 py-1 rounded-xl bg-orange-100 text-[#FF5A36] text-xs font-extrabold uppercase tracking-wider">
                Messaggio da ${escapeHTML(author)}
              </span>
              <p class="font-display font-extrabold text-2xl sm:text-3xl text-slate-900 leading-snug">
                “${escapeHTML(text)}”
              </p>
            </div>
          `);
        } else if (action === 'send-reaction') {
          store.sendReaction(appState.roomCode, btn.dataset.emoji);
        } else if (action === 'vote-mc') {
          const isSim = btn.dataset.sim === 'true';
          const pid = isSim ? SIMULATED_STUDENTS[appState.simStudentIndex].id : participantDeviceId;
          store.submitVote(appState.roomCode, btn.dataset.slideId, pid, btn.dataset.optionId, !isSim);
          showToast('Voto inviato!', 'success');
        } else if (action === 'vote-quiz') {
          const isSim = btn.dataset.sim === 'true';
          const simObj = SIMULATED_STUDENTS[appState.simStudentIndex];
          const pid = isSim ? simObj.id : participantDeviceId;
          const pName = isSim ? simObj.name : (appState.studentName || 'Studente');
          const room = store.getRoom(appState.roomCode);
          const slide = room?.slides.find(s => s.id === btn.dataset.slideId);
          if (!slide || slide.status === 'waiting' || slide.status === 'ended') return;
          const chosenOpt = (slide.options || []).find(o => o.id === btn.dataset.optionId);
          const isCorrect = Boolean(chosenOpt && chosenOpt.isCorrect);
          const dur = slide.duration || 25;
          const left = slide.timeLeft || 0;
          const points = isCorrect ? Math.round(500 + 500 * Math.max(0, left / dur)) : 0;

          store.submitVote(appState.roomCode, slide.id, pid, {
            optionId: btn.dataset.optionId,
            isCorrect,
            points,
            name: pName
          }, !isSim);
          showToast('Risposta inviata al Quiz!', 'success');
        } else if (action === 'rank-move') {
          const key = btn.dataset.draftKey;
          const idx = Number(btn.dataset.index);
          const dir = Number(btn.dataset.dir);
          const arr = appState.drafts[key];
          if (Array.isArray(arr) && idx + dir >= 0 && idx + dir < arr.length) {
            const tmp = arr[idx];
            arr[idx] = arr[idx + dir];
            arr[idx + dir] = tmp;
            renderApp();
          }
        } else if (action === 'submit-ranking') {
          const isSim = btn.dataset.sim === 'true';
          const pid = isSim ? SIMULATED_STUDENTS[appState.simStudentIndex].id : participantDeviceId;
          const order = appState.drafts[btn.dataset.draftKey];
          if (Array.isArray(order)) {
            store.submitVote(appState.roomCode, btn.dataset.slideId, pid, [...order], !isSim);
            showToast('Classifica inviata!', 'success');
          }
        } else if (action === 'upvote-qa') {
          store.toggleUpvoteQuestion(appState.roomCode, btn.dataset.qaid, participantDeviceId, true);
        } else if (action === 'simulate-class-votes') {
          const room = store.getRoom(appState.roomCode);
          if (!room) return;
          const slide = room.slides[room.activeSlideIndex];
          if (!slide) return;
          const sampleWords = ['Impegno', 'Collaborazione', 'Futuro', 'Lingua', 'Amicizia', 'Studio', 'Lavoro', 'Speranza'];

          SIMULATED_STUDENTS.forEach((st, idx) => {
            if (slide.type === 'wordcloud') {
              const w1 = sampleWords[(idx * 2) % sampleWords.length];
              const w2 = sampleWords[(idx * 2 + 1) % sampleWords.length];
              store.submitVote(room.code, slide.id, st.id, [w1, w2], false);
            } else if (slide.type === 'multiple_choice' && slide.options?.length) {
              const pick = slide.options[idx % slide.options.length];
              store.submitVote(room.code, slide.id, st.id, pick.id, false);
            } else if (slide.type === 'scales' && slide.statements?.length) {
              const obj = {};
              slide.statements.forEach((s, si) => { obj[s.id] = Math.min(5, Math.max(1, 3 + ((idx + si) % 3))); });
              store.submitVote(room.code, slide.id, st.id, obj, false);
            } else if (slide.type === 'ranking' && slide.items?.length) {
              const ids = slide.items.map(i => i.id);
              const rotated = ids.map((_, k) => ids[(k + idx) % ids.length]);
              store.submitVote(room.code, slide.id, st.id, rotated, false);
            } else if (slide.type === 'open_ended') {
              const phrases = [
                'Grazie per questa lezione chiara e interessante!',
                'Vorrei fare altri esercizi pratici come questo.',
                'Molto utile per la vita di tutti i giorni.',
                'Mi piace lavorare insieme ai compagni di classe.',
                'Tutto chiaro, possiamo andare avanti!'
              ];
              store.submitVote(room.code, slide.id, st.id, {
                text: phrases[idx % phrases.length],
                author: st.name,
                ts: Date.now()
              }, false);
            } else if (slide.type === 'quiz' && slide.options?.length) {
              const pick = idx % 3 === 0 ? (slide.options[1] || slide.options[0]) : (slide.options.find(o => o.isCorrect) || slide.options[0]);
              store.submitVote(room.code, slide.id, st.id, {
                optionId: pick.id,
                isCorrect: Boolean(pick.isCorrect),
                points: pick.isCorrect ? (750 + idx * 45) : 0,
                name: st.name
              }, false);
            }
          });
          showToast('Simulati 5 voti della classe!', 'success');
        } else if (action === 'export-csv') {
          exportRoomResults(store.getRoom(appState.roomCode), 'csv');
        } else if (action === 'export-json') {
          exportRoomResults(store.getRoom(appState.roomCode), 'json');
        }
      });

      document.addEventListener('input', (e) => {
        const el = e.target;
        const action = el.dataset.action;

        if (action === 'edit-room-title') {
          store.updateRoom(appState.roomCode, (r) => { r.title = el.value; });
        } else if (action === 'edit-slide-field') {
          const field = el.dataset.field;
          store.updateRoom(appState.roomCode, (r) => {
            const sl = r.slides[r.activeSlideIndex];
            if (sl) {
              sl[field] = field === 'maxWords' ? Number(el.value) : el.value;
            }
          });
        } else if (action === 'edit-option-text') {
          const optId = el.dataset.optionId;
          store.updateRoom(appState.roomCode, (r) => {
            const sl = r.slides[r.activeSlideIndex];
            const opt = sl?.options?.find(o => o.id === optId);
            if (opt) opt.text = el.value;
          });
        } else if (action === 'edit-statement-text') {
          const stId = el.dataset.stid;
          store.updateRoom(appState.roomCode, (r) => {
            const sl = r.slides[r.activeSlideIndex];
            const st = sl?.statements?.find(s => s.id === stId);
            if (st) st.text = el.value;
          });
        } else if (action === 'edit-rank-item') {
          const itemId = el.dataset.itemId;
          store.updateRoom(appState.roomCode, (r) => {
            const sl = r.slides[r.activeSlideIndex];
            const it = sl?.items?.find(i => i.id === itemId);
            if (it) it.text = el.value;
          });
        } else if (action === 'change-scale-slider') {
          const key = el.dataset.draftKey;
          const stId = el.dataset.stid;
          const val = Number(el.value);
          if (!appState.drafts[key]) appState.drafts[key] = {};
          appState.drafts[key][stId] = val;
          const badge = document.querySelector(`[data-scale-badge="${key}_${stId}"]`);
          if (badge) badge.textContent = String(val);
        } else if (action === 'edit-student-name') {
          appState.studentName = el.value;
          sessionStorage.setItem('aulalive_student_name', el.value);
        } else if (el.dataset.draftKey && el.dataset.wordIndex !== undefined) {
          const key = el.dataset.draftKey;
          const idx = Number(el.dataset.wordIndex);
          if (!appState.drafts[key]) appState.drafts[key] = [];
          appState.drafts[key][idx] = el.value;
        } else if (el.dataset.openDraft) {
          appState.drafts[el.dataset.openDraft] = el.value;
        }
      });

      document.addEventListener('change', (e) => {
        const el = e.target;
        if (el.dataset.action === 'change-sim-student') {
          appState.simStudentIndex = Number(el.value || 0);
          renderApp();
        } else if (el.dataset.action === 'edit-quiz-duration') {
          const dur = Number(el.value || 25);
          store.updateRoom(appState.roomCode, (r) => {
            const sl = r.slides[r.activeSlideIndex];
            if (sl && sl.type === 'quiz') {
              sl.duration = dur;
              if (sl.status === 'waiting') sl.timeLeft = dur;
            }
          });
        }
      });

      document.addEventListener('submit', (e) => {
        const form = e.target.closest('form[data-action]');
        if (!form) return;
        e.preventDefault();
        const action = form.dataset.action;

        if (action === 'join-room-form') {
          const code = (form.querySelector('[name="roomCode"]')?.value || '').trim();
          if (!/^\d{6}$/.test(code)) {
            showToast('Inserisci un codice valido di 6 cifre', 'warning');
            return;
          }
          navigateTo('audience', code);
        } else if (action === 'submit-wordcloud') {
          const isSim = form.dataset.sim === 'true';
          const pid = isSim ? SIMULATED_STUDENTS[appState.simStudentIndex].id : participantDeviceId;
          const inputs = Array.from(form.querySelectorAll('input[data-word-index]'));
          const words = inputs.map(i => i.value.trim()).filter(Boolean);
          if (words.length === 0) {
            showToast('Scrivi almeno una parola prima di inviare', 'warning');
            return;
          }
          store.submitVote(appState.roomCode, form.dataset.slideId, pid, words, !isSim);
          showToast('Parole inviate alla nuvola!', 'success');
        } else if (action === 'submit-scales') {
          const isSim = form.dataset.sim === 'true';
          const pid = isSim ? SIMULATED_STUDENTS[appState.simStudentIndex].id : participantDeviceId;
          const draftKey = `${appState.roomCode}_${form.dataset.slideId}_${pid}`;
          const vals = appState.drafts[draftKey] || {};
          store.submitVote(appState.roomCode, form.dataset.slideId, pid, { ...vals }, !isSim);
          showToast('Valutazione inviata!', 'success');
        } else if (action === 'submit-open') {
          const isSim = form.dataset.sim === 'true';
          const simObj = SIMULATED_STUDENTS[appState.simStudentIndex];
          const pid = isSim ? simObj.id : participantDeviceId;
          const author = isSim ? simObj.name : (appState.studentName || 'Studente');
          const ta = form.querySelector('textarea');
          const text = (ta?.value || '').trim();
          if (!text) {
            showToast('Scrivi un messaggio prima di inviare', 'warning');
            return;
          }
          store.submitVote(appState.roomCode, form.dataset.slideId, pid, {
            text,
            author,
            ts: Date.now()
          }, !isSim);
          showToast('Bigliettino inviato alla LIM!', 'success');
        } else if (action === 'submit-qa-form') {
          const ta = form.querySelector('[name="qaText"]');
          const text = (ta?.value || '').trim();
          if (!text) return;
          store.addQuestion(appState.roomCode, text, appState.studentName || 'Studente', true);
          if (ta) ta.value = '';
          showToast('Domanda inviata!', 'success');
        }
      });

      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          const modal = document.getElementById('modal-container');
          if (modal && !modal.classList.contains('hidden')) {
            closeModal();
            return;
          }
          if (appState.showQaDrawer) {
            appState.showQaDrawer = false;
            renderApp();
          }
          return;
        }

        if (appState.view === 'stage' && !['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) {
          if (e.key === 'ArrowRight') {
            store.updateRoom(appState.roomCode, (r) => {
              r.activeSlideIndex = Math.min(r.slides.length - 1, (r.activeSlideIndex || 0) + 1);
            });
          } else if (e.key === 'ArrowLeft') {
            store.updateRoom(appState.roomCode, (r) => {
              r.activeSlideIndex = Math.max(0, (r.activeSlideIndex || 0) - 1);
            });
          }
        }
      });

      // Riconnessione automatica smartphone al risveglio schermo
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && appState.view === 'audience' && appState.roomCode) {
          store.sync.connectClient(appState.roomCode);
        }
      });

      // =========================================================================
      // 12B. DRAG & DROP + TOUCH PER UNIRE PAROLE NELLA WORD CLOUD
      // =========================================================================
      let draggedWcWord = null;
      let touchDragState = null;

      document.addEventListener('dragstart', (e) => {
        const wordEl = e.target.closest('.wc-word');
        if (!wordEl) return;
        draggedWcWord = {
          key: wordEl.dataset.wcKey,
          label: wordEl.dataset.wcLabel
        };
        wordEl.classList.add('wc-dragging');
        if (e.dataTransfer) {
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', wordEl.dataset.wcKey || '');
        }
      });

      document.addEventListener('dragover', (e) => {
        if (!draggedWcWord) return;
        const targetEl = e.target.closest('.wc-word');
        if (targetEl && targetEl.dataset.wcKey !== draggedWcWord.key) {
          e.preventDefault();
          document.querySelectorAll('.wc-word.wc-drop-target').forEach(el => {
            if (el !== targetEl) el.classList.remove('wc-drop-target');
          });
          targetEl.classList.add('wc-drop-target');
        }
      });

      document.addEventListener('dragleave', (e) => {
        const targetEl = e.target.closest('.wc-word');
        if (targetEl) {
          targetEl.classList.remove('wc-drop-target');
        }
      });

      document.addEventListener('drop', (e) => {
        if (!draggedWcWord) return;
        const targetEl = e.target.closest('.wc-word');
        if (targetEl && targetEl.dataset.wcKey !== draggedWcWord.key) {
          e.preventDefault();
          const src = draggedWcWord;
          const tgtKey = targetEl.dataset.wcKey;
          const tgtLabel = targetEl.dataset.wcLabel;
          draggedWcWord = null;
          document.querySelectorAll('.wc-word').forEach(el => el.classList.remove('wc-dragging', 'wc-drop-target'));
          mergeWordCloudTerms(src.key, src.label, tgtKey, tgtLabel);
        }
      });

      document.addEventListener('dragend', () => {
        draggedWcWord = null;
        document.querySelectorAll('.wc-word').forEach(el => el.classList.remove('wc-dragging', 'wc-drop-target'));
      });

      document.addEventListener('touchstart', (e) => {
        const wordEl = e.target.closest('.wc-word');
        if (!wordEl || e.touches.length !== 1) return;
        const touch = e.touches[0];
        const ghost = wordEl.cloneNode(true);
        ghost.style.position = 'fixed';
        ghost.style.left = `${touch.clientX}px`;
        ghost.style.top = `${touch.clientY}px`;
        ghost.style.transform = 'translate(-50%, -50%) scale(1.12)';
        ghost.style.pointerEvents = 'none';
        ghost.style.zIndex = '9999';
        ghost.style.opacity = '0.9';
        ghost.style.background = 'rgba(255, 255, 255, 0.94)';
        ghost.style.boxShadow = '0 12px 28px rgba(15, 23, 42, 0.22)';
        document.body.appendChild(ghost);

        wordEl.classList.add('wc-dragging');
        touchDragState = {
          sourceEl: wordEl,
          key: wordEl.dataset.wcKey,
          label: wordEl.dataset.wcLabel,
          ghost,
          currentTarget: null
        };
      }, { passive: true });

      document.addEventListener('touchmove', (e) => {
        if (!touchDragState || e.touches.length !== 1) return;
        e.preventDefault();
        const touch = e.touches[0];
        touchDragState.ghost.style.left = `${touch.clientX}px`;
        touchDragState.ghost.style.top = `${touch.clientY}px`;

        const under = document.elementFromPoint(touch.clientX, touch.clientY);
        const targetEl = under ? under.closest('.wc-word') : null;

        if (touchDragState.currentTarget && touchDragState.currentTarget !== targetEl) {
          touchDragState.currentTarget.classList.remove('wc-drop-target');
          touchDragState.currentTarget = null;
        }
        if (targetEl && targetEl !== touchDragState.sourceEl && targetEl.dataset.wcKey !== touchDragState.key) {
          targetEl.classList.add('wc-drop-target');
          touchDragState.currentTarget = targetEl;
        }
      }, { passive: false });

      document.addEventListener('touchend', () => {
        if (!touchDragState) return;
        const { sourceEl, key, label, ghost, currentTarget } = touchDragState;
        touchDragState = null;
        if (ghost && ghost.parentNode) ghost.parentNode.removeChild(ghost);
        if (sourceEl) sourceEl.classList.remove('wc-dragging');
        if (currentTarget) {
          currentTarget.classList.remove('wc-drop-target');
          mergeWordCloudTerms(key, label, currentTarget.dataset.wcKey, currentTarget.dataset.wcLabel);
        }
      });

      // =========================================================================
      // 13. ESPORTAZIONE RISULTATI CSV (RFC 4180 + BOM UTF-8) E JSON
      // =========================================================================
      function exportRoomResults(room, format = 'csv') {
        if (!room) return;
        const baseName = `aulalive_cpia_${room.code}_${new Date().toISOString().slice(0, 10)}`;

        if (format === 'json') {
          const blob = new Blob([JSON.stringify(room, null, 2)], { type: 'application/json;charset=utf-8' });
          triggerDownload(blob, `${baseName}.json`);
          showToast('File JSON esportato!', 'success');
          return;
        }

        const rows = [['Slide #', 'Tipologia', 'Domanda', 'Partecipante ID', 'Risposta']];
        (room.slides || []).forEach((sl, idx) => {
          const responses = sl.responses || {};
          Object.entries(responses).forEach(([pid, val]) => {
            let formatted = '';
            if (Array.isArray(val)) {
              formatted = val.join(' | ');
            } else if (typeof val === 'object' && val !== null) {
              formatted = val.text ? `${val.author || pid}: ${val.text}` : JSON.stringify(val);
            } else {
              formatted = String(val);
            }
            rows.push([
              String(idx + 1),
              SLIDE_TYPES[sl.type]?.label || sl.type,
              sl.question,
              pid,
              formatted
            ]);
          });
        });

        const csvContent = '\uFEFF' + rows.map(r =>
          r.map(cell => `"${String(cell || '').replace(/"/g, '""')}"`).join(';')
        ).join('\r\n');

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8' });
        triggerDownload(blob, `${baseName}.csv`);
        showToast('File CSV esportato (pronto per Excel)!', 'success');
      }

      function triggerDownload(blob, filename) {
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        setTimeout(() => {
          document.body.removeChild(a);
          URL.revokeObjectURL(url);
        }, 100);
      }

      // =========================================================================
      // 14. AVVIO APPLICAZIONE E GESTIONE DEEP-LINK (#join=XXXXXX)
      // =========================================================================
      store.subscribe(() => {
        renderApp();
      });

      function bootstrap() {
        ensureQuizTimerLoop();
        const hash = window.location.hash || '';
        const match = hash.match(/join=(\d{6})/);
        if (match && match[1]) {
          navigateTo('audience', match[1]);
        } else {
          renderApp();
        }
      }

      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', bootstrap);
      } else {
        bootstrap();
      }
    })();
  </script>
</body>
</html>
