  <style>
    * {
      box-sizing: border-box;
    }
    html {
      font-size: 16px;
      transition: font-size 0.2s ease;
    }
    body {
      font-family: 'DM Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #FAF7F2;
      color: #1E293B;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    h1, h2, h3, h4, .font-display {
      font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    }

    /* Trama leggera a puntini stile quaderno moderno */
    .bg-notebook {
      background-color: #FAF7F2;
      background-image: radial-gradient(#CBD5E1 1.15px, transparent 1.15px);
      background-size: 22px 22px;
    }

    /* Pulsanti tattili con effetto pressione fisica */
    .btn-tactile {
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease, background-color 0.15s ease;
      box-shadow: 0 3px 0 0 rgba(15, 23, 42, 0.16);
    }
    .btn-tactile:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 4px 0 0 rgba(15, 23, 42, 0.18);
    }
    .btn-tactile:active:not(:disabled) {
      transform: translateY(2px);
      box-shadow: 0 1px 0 0 rgba(15, 23, 42, 0.16);
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.92) translateY(8px); }
      70% { opacity: 1; transform: scale(1.01) translateY(-1px); }
      100% { opacity: 1; transform: scale(1) translateY(0); }
    }
    .animate-pop-in {
      animation: popIn 0.3s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes floatReaction {
      0% {
        opacity: 0;
        transform: translateY(16px) translateX(0px) scale(0.65);
      }
      15% {
        opacity: 1;
        transform: translateY(-28px) translateX(var(--sway-1, 14px)) scale(1.15);
      }
      55% {
        opacity: 0.95;
        transform: translateY(-175px) translateX(var(--sway-2, -16px)) scale(1.05);
      }
      85% {
        opacity: 0.45;
        transform: translateY(-305px) translateX(var(--sway-3, 10px)) scale(0.95);
      }
      100% {
        opacity: 0;
        transform: translateY(-385px) translateX(0px) scale(0.8);
      }
    }
    .floating-emoji {
      position: fixed;
      bottom: 84px;
      pointer-events: none;
      z-index: 9999;
      font-size: 2.35rem;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.18));
      animation: floatReaction 2.8s cubic-bezier(0.25, 0.8, 0.25, 1) forwards;
    }

    @keyframes confettiFall {
      0% { transform: translateY(-20px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(420px) rotate(540deg); opacity: 0; }
    }
    .confetti-piece {
      position: absolute;
      top: 0;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      pointer-events: none;
      animation: confettiFall 2.8s ease-out forwards;
    }

    /* Scrollbar discreta */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.45);
      border-radius: 999px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.7);
    }

    /* Range slider accessibile per Scale di Valutazione */
    input[type="range"].aula-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 14px;
      border-radius: 999px;
      background: #E2E8F0;
      outline: none;
      transition: background 0.2s;
    }
    input[type="range"].aula-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #FF5A36;
      border: 4px solid #FFFFFF;
      box-shadow: 0 4px 12px rgba(255, 90, 54, 0.45);
      cursor: pointer;
      transition: transform 0.15s ease;
    }
    input[type="range"].aula-slider::-webkit-slider-thumb:hover {
      transform: scale(1.14);
    }
    input[type="range"].aula-slider::-moz-range-thumb {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #FF5A36;
      border: 4px solid #FFFFFF;
      box-shadow: 0 4px 12px rgba(255, 90, 54, 0.45);
      cursor: pointer;
    }

    /* Transizioni fluide per le parole della Nuvola + Drag & Drop / Touch Merge */
    .wc-word {
      transition: transform 0.25s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.3s ease, background-color 0.2s ease;
      user-select: none;
      cursor: grab;
      touch-action: none;
    }
    .wc-word:hover {
      transform: scale(1.09) !important;
      z-index: 20 !important;
    }
    .wc-word.wc-dragging {
      cursor: grabbing;
      opacity: 0.78 !important;
      z-index: 40 !important;
      transform: scale(1.14) !important;
    }
    .wc-word.wc-drop-target {
      outline: 3px dashed #FF5A36;
      outline-offset: 4px;
      background-color: rgba(255, 90, 54, 0.14);
      transform: scale(1.18) !important;
      z-index: 35 !important;
    }
  </style>

      function escapeHTML(str) {
        if (str === null || str === undefined) return '';
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function uid(prefix = 'id') {
        return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 7)}`;
      }

      function generateRoomCode(existingRooms = {}) {
        let code;
        let attempts = 0;
        do {
          code = String(Math.floor(100000 + Math.random() * 900000));
          attempts++;
        } while (existingRooms[code] && attempts < 50);
        return code;
      }

      function showToast(message, type = 'info') {
        const container = document.getElementById('toast-container');
        if (!container) return;
        const colors = {
          info: 'bg-slate-900 text-white border-slate-700',
          success: 'bg-emerald-600 text-white border-emerald-500',
          warning: 'bg-amber-500 text-slate-950 border-amber-400',
          error: 'bg-rose-600 text-white border-rose-500'
        };
        const toast = document.createElement('div');
        toast.className = `pointer-events-auto px-4 py-3 rounded-2xl border shadow-lg text-sm font-semibold flex items-center gap-2.5 animate-pop-in ${colors[type] || colors.info}`;
        toast.innerHTML = `<span>${escapeHTML(message)}</span>`;
        container.appendChild(toast);
        setTimeout(() => {
          toast.style.opacity = '0';
          toast.style.transform = 'translateY(6px)';

      function spawnFloatingReaction(emoji) {
        if (!emoji) return;
        const el = document.createElement('div');
        el.className = 'floating-emoji';

      }

      // Generatore QR Code SVG deterministico locale (zero dipendenze esterne)
      function generateLocalQRSVG(text, size = 210) {
        const modules = 25;
        let hash = 2166136261;
        for (let i = 0; i < text.length; i++) {
          hash ^= text.charCodeAt(i);
          hash = Math.imul(hash, 16777619);
        }
        const grid = Array.from({ length: modules }, () => Array(modules).fill(false));

        function drawFinder(r0, c0) {
          for (let r = -1; r <= 7; r++) {
            for (let c = -1; c <= 7; c++) {
              const rr = r0 + r;
              const cc = c0 + c;
              if (rr < 0 || rr >= modules || cc < 0 || cc >= modules) continue;
              if (r === -1 || r === 7 || c === -1 || c === 7) {
                grid[rr][cc] = false;
              } else if (r === 0 || r === 6 || c === 0 || c === 6 || (r >= 2 && r <= 4 && c >= 2 && c <= 4)) {
                grid[rr][cc] = true;
              } else {
                grid[rr][cc] = false;
              }
            }
          }
        }
        drawFinder(0, 0);
        drawFinder(0, modules - 7);
        drawFinder(modules - 7, 0);

        let seed = Math.abs(hash) || 1234567;
        for (let r = 0; r < modules; r++) {
          for (let c = 0; c < modules; c++) {
            const inTopLeft = r < 8 && c < 8;
            const inTopRight = r < 8 && c >= modules - 8;
            const inBottomLeft = r >= modules - 8 && c < 8;
            if (inTopLeft || inTopRight || inBottomLeft) continue;
            seed = (seed * 1664525 + 1013904223) % 4294967296;
            const charBit = text.charCodeAt((r * modules + c) % text.length) & (1 << ((r + c) % 7));
            grid[r][c] = ((seed >>> 24) & 1) === 1 || Boolean(charBit);
          }
        }

        const cell = size / (modules + 2);
        let rects = '';
        for (let r = 0; r < modules; r++) {
          for (let c = 0; c < modules; c++) {
            if (grid[r][c]) {
              const x = ((c + 1) * cell).toFixed(2);
              const y = ((r + 1) * cell).toFixed(2);
              const s = (cell * 0.96).toFixed(2);
              rects += `<rect x="${x}" y="${y}" width="${s}" height="${s}" rx="${(cell * 0.22).toFixed(2)}" fill="#0F172A"/>`;
            }
          }
        }
        return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" class="mx-auto rounded-2xl bg-white p-2 border-2 border-slate-200">${rects}</svg>`;
      }

      // =========================================================================
      // 4. MOTORE DI SINCRONIZZAZIONE P2P (WebRTC PeerJS) + ARCHIVIO LOCALE
      // =========================================================================
      const PEER_PREFIX = 'aulalive-cpia-';
      const PEER_CONFIG = {
        debug: 0,
        config: {
          iceServers: [
            { urls: 'stun:stun.l.google.com:19302' },
            { urls: 'stun:stun1.l.google.com:19302' }
          ]
        }
      };

      class SyncEngine {
        constructor(store) {
          this.store = store;
          this.peer = null;
          this.role = null; // 'host' | 'client' | null
          this.roomCode = null;
          this.status = 'idle'; // 'idle' | 'connecting' | 'online' | 'local_only' | 'error'
          this.connections = new Map(); // host -> student connections
          this.hostConn = null; // client -> host connection
          this.retryTimer = null;
        }

        getConnectedCount() {
          let count = 0;
          this.connections.forEach(conn => {
            if (conn && conn.open) count++;
          });
          return count;
        }

        stop() {
          if (this.retryTimer) {
            clearTimeout(this.retryTimer);
            this.retryTimer = null;
          }
          this.connections.forEach(conn => {
            try { conn.close(); } catch (_) {}
          });
          this.connections.clear();
          if (this.hostConn) {
            try { this.hostConn.close(); } catch (_) {}
            this.hostConn = null;
          }
          if (this.peer) {
            try { this.peer.destroy(); } catch (_) {}
            this.peer = null;
          }
          this.role = null;
          this.roomCode = null;
          this.status = 'idle';
        }

        startHost(code) {
          if (!code) return;
          if (this.role === 'host' && this.roomCode === code && this.peer && !this.peer.destroyed) {
            return;
          }
          this.stop();
          this.role = 'host';
          this.roomCode = code;

          if (typeof window.Peer === 'undefined') {
            this.status = 'local_only';
            this.store.emit();
            return;
          }

          this.status = 'connecting';
          this.store.emit();

          try {
            const peerId = `${PEER_PREFIX}${code}`;
            const peer = new window.Peer(peerId, PEER_CONFIG);
            this.peer = peer;

            peer.on('open', () => {
              this.status = 'online';
              this.store.emit();
            });

            peer.on('connection', (conn) => {
              this.connections.set(conn.peer, conn);
              conn.on('open', () => {
                const room = this.store.getRoom(code);
                if (room) {
                  try {
                    conn.send({ type: 'ROOM_STATE', room });
                  } catch (_) {}
                }
                this.store.emit();
              });

              conn.on('data', (msg) => {
                this.handleHostMessage(msg, conn);
              });

              conn.on('close', () => {
                this.connections.delete(conn.peer);
                this.store.emit();
              });

              conn.on('error', () => {
                this.connections.delete(conn.peer);
                this.store.emit();
              });
            });

            peer.on('error', () => {
              this.status = 'local_only';
              this.store.emit();
            });
          } catch (_) {
            this.status = 'local_only';
            this.store.emit();
          }
        }

        broadcastState(room) {
          if (this.role !== 'host' || !room || room.code !== this.roomCode) return;
          this.connections.forEach(conn => {
            if (conn && conn.open) {
              try {
                conn.send({ type: 'ROOM_STATE', room });
              } catch (_) {}
            }
          });
        }

        handleHostMessage(msg, conn) {
          if (!msg || typeof msg !== 'object') return;
          const code = this.roomCode;
          if (!code) return;

          if (msg.type === 'REQUEST_STATE') {
            const room = this.store.getRoom(code);
            if (room && conn && conn.open) {
              try { conn.send({ type: 'ROOM_STATE', room }); } catch (_) {}
            }
            return;
          }

          if (msg.type === 'SUBMIT_VOTE') {
            this.store.submitVote(code, msg.slideId, msg.participantId, msg.payload, false);
          } else if (msg.type === 'SUBMIT_QA') {
            this.store.addQuestion(code, msg.text, msg.author, false);
          } else if (msg.type === 'UPVOTE_QA') {
            this.store.toggleUpvoteQuestion(code, msg.qaId, msg.participantId, false);
          } else if (msg.type === 'REACTION') {
            spawnFloatingReaction(msg.emoji);
            this.store.bcPost({ type: 'REACTION', code, emoji: msg.emoji });
          }
        }

        connectClient(code) {
          if (!code) return;
          if (this.role === 'client' && this.roomCode === code && this.hostConn && this.hostConn.open) {
            return;
          }
          this.stop();
          this.role = 'client';
          this.roomCode = code;

          const localRoom = this.store.getRoom(code);
          if (localRoom) {
            this.store.remoteRooms[code] = localRoom;
          }

          if (typeof window.Peer === 'undefined') {
            this.status = localRoom ? 'online' : 'error';
            this.store.emit();
            return;
          }

          this.status = 'connecting';
          this.store.emit();

          try {
            const peer = new window.Peer(PEER_CONFIG);
            this.peer = peer;

            peer.on('open', () => {
              const conn = peer.connect(`${PEER_PREFIX}${code}`, { reliable: true });
              this.hostConn = conn;

              conn.on('open', () => {
                this.status = 'online';
                try { conn.send({ type: 'REQUEST_STATE' }); } catch (_) {}
                this.store.emit();
              });

              conn.on('data', (msg) => {
                if (msg && msg.type === 'ROOM_STATE' && msg.room) {
                  this.store.remoteRooms[code] = msg.room;
                  this.status = 'online';
                  this.store.emit();
                }
              });

              conn.on('close', () => {
                this.status = 'error';
                this.store.emit();
              });

              conn.on('error', () => {
                this.status = 'error';
                this.store.emit();
              });
            });

            peer.on('error', () => {
              this.status = this.store.getRoom(code) ? 'online' : 'error';
              this.store.emit();
            });
          } catch (_) {
            this.status = this.store.getRoom(code) ? 'online' : 'error';
            this.store.emit();
          }
        }

        sendToHost(payload) {
          if (this.role === 'client' && this.hostConn && this.hostConn.open) {
            try {
              this.hostConn.send(payload);
              return true;
            } catch (_) {
              return false;
            }
          }
          return false;
        }
      }

      // =========================================================================
      // 5. STORE CENTRALE STATO APPLICAZIONE (Menti-Free: AulaStore)
      // =========================================================================
      class AulaStore {
        constructor() {
          this.rooms = {};
          this.remoteRooms = {};
          this.listeners = new Set();
          this.bc = null;
          this.sync = new SyncEngine(this);
          this.loadFromStorage();
          this.initBroadcastChannel();
        }

        loadFromStorage() {
          try {
            const raw = localStorage.getItem(STORAGE_KEY);
            if (raw) {
              const parsed = JSON.parse(raw);
              if (parsed && typeof parsed === 'object' && Object.keys(parsed).length > 0) {
                this.rooms = parsed;
                return;
              }
            }
          } catch (_) {}
          const demo = buildDemoRoom();
          this.rooms = { [demo.code]: demo };
          this.saveToStorage(false);
        }

        saveToStorage(broadcast = true) {
          try {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(this.rooms));
          } catch (_) {}
          if (broadcast) {
            this.bcPost({ type: 'SYNC_ALL', rooms: this.rooms });
          }
        }

        initBroadcastChannel() {
          try {
            if ('BroadcastChannel' in window) {
              this.bc = new BroadcastChannel(CHANNEL_NAME);
              this.bc.onmessage = (ev) => {
                const data = ev.data;
                if (!data) return;
                if (data.type === 'SYNC_ALL' && data.rooms) {
                  this.rooms = data.rooms;
                  this.emit();
                } else if (data.type === 'REACTION') {
                  if (appState.roomCode === data.code) {
                    spawnFloatingReaction(data.emoji);
                  }
                }
              };
            }
          } catch (_) {}

          window.addEventListener('storage', (ev) => {
            if (ev.key === STORAGE_KEY && ev.newValue) {
              try {
                this.rooms = JSON.parse(ev.newValue);
                this.emit();
              } catch (_) {}
            }
          });
        }

        bcPost(msg) {
          if (this.bc) {
            try { this.bc.postMessage(msg); } catch (_) {}
          }
        }

        subscribe(fn) {
          this.listeners.add(fn);
          return () => this.listeners.delete(fn);
        }

        emit() {
          this.listeners.forEach(fn => {
            try { fn(); } catch (err) { console.error(err); }
          });
        }

        getRoom(code) {
          if (!code) return null;
          return this.rooms[code] || this.remoteRooms[code] || null;
        }

        createRoom(title = 'Nuova Lezione Interattiva') {
          const code = generateRoomCode(this.rooms);
          const s1 = createSlideTemplate('multiple_choice');
          const room = {
            code,
            title: title.trim() || 'Nuova Lezione Interattiva',
            theme: 'cream',
            activeSlideIndex: 0,
            slides: [s1],
            qa: [],
            updatedAt: Date.now()
          };
          this.rooms[code] = room;
          this.saveToStorage();
          this.emit();
          return room;
        }

        createFromTemplate(templateKey) {
          const room = buildTemplateRoom(templateKey, this.rooms);
          this.rooms[room.code] = room;
          this.saveToStorage();
          this.emit();
          return room;
        }

        deleteRoom(code) {
          if (!this.rooms[code]) return;
          delete this.rooms[code];
          if (Object.keys(this.rooms).length === 0) {
            const demo = buildDemoRoom();
            this.rooms[demo.code] = demo;
          }
          this.saveToStorage();
          this.emit();
        }

        updateRoom(code, updaterFn) {
          const room = this.rooms[code];
          if (!room) return;
          updaterFn(room);
          room.updatedAt = Date.now();
          this.saveToStorage();
          this.sync.broadcastState(room);
          this.emit();
        }

        submitVote(code, slideId, participantId, payload, forwardIfClient = true) {
          if (forwardIfClient && this.sync.role === 'client') {
            this.sync.sendToHost({
              type: 'SUBMIT_VOTE',
              slideId,
              participantId,
              payload
            });
            const rRoom = this.remoteRooms[code];
            if (rRoom) {
              const sl = rRoom.slides.find(s => s.id === slideId);
              if (sl) {
                if (!sl.responses) sl.responses = {};
                sl.responses[participantId] = payload;
                this.emit();
              }
            }
            return;
          }

          this.updateRoom(code, (room) => {
            const slide = room.slides.find(s => s.id === slideId);
            if (!slide) return;
            if (!slide.responses) slide.responses = {};
            slide.responses[participantId] = payload;
          });
        }

        addQuestion(code, text, author = 'Studente', forwardIfClient = true) {
          const clean = (text || '').trim();
          if (!clean) return;
          if (forwardIfClient && this.sync.role === 'client') {
            this.sync.sendToHost({ type: 'SUBMIT_QA', text: clean, author });
            return;
          }
          this.updateRoom(code, (room) => {
            if (!room.qa) room.qa = [];
            room.qa.unshift({
              id: uid('qa'),
              text: clean,
              author: (author || 'Studente').trim(),
              upvotes: 1,
              upvotedBy: [],
              answered: false,
              ts: Date.now()
            });
          });
        }

        toggleUpvoteQuestion(code, qaId, participantId, forwardIfClient = true) {
          if (forwardIfClient && this.sync.role === 'client') {
            this.sync.sendToHost({ type: 'UPVOTE_QA', qaId, participantId });
            return;
          }
          this.updateRoom(code, (room) => {
            const q = (room.qa || []).find(item => item.id === qaId);
            if (!q) return;
            if (!q.upvotedBy) q.upvotedBy = [];
            const idx = q.upvotedBy.indexOf(participantId);
            if (idx === -1) {
              q.upvotedBy.push(participantId);
              q.upvotes = (q.upvotes || 0) + 1;
            } else {
              q.upvotedBy.splice(idx, 1);
              q.upvotes = Math.max(0, (q.upvotes || 1) - 1);
            }
          });
        }

        sendReaction(code, emoji) {
          spawnFloatingReaction(emoji);
          this.bcPost({ type: 'REACTION', code, emoji });
          if (this.sync.role === 'client') {
            this.sync.sendToHost({ type: 'REACTION', emoji });
          }
        }
      }

      const store = new AulaStore();

      // =========================================================================
      // 6. STATO UI LOCALE, TIMER QUIZ E PRESERVAZIONE FOCUS
      // =========================================================================
      let participantDeviceId = sessionStorage.getItem('aulalive_device_id');
      if (!participantDeviceId) {
        participantDeviceId = uid('stu');
        sessionStorage.setItem('aulalive_device_id', participantDeviceId);
      }

      const appState = {
        view: 'home', // 'home' | 'editor' | 'stage' | 'audience'
        roomCode: null,
        editorTab: 'content', // 'content' | 'theme'
        mobileEditorPane: 'edit', // 'slides' | 'preview' | 'edit'
        showPhoneSim: true,

        showQaDrawer: false,

        studentName: sessionStorage.getItem('aulalive_student_name') || '',
        audienceSubTab: 'vote', // 'vote' | 'qa'

      };

      let quizIntervalId = null;

      function applyGlobalFontScale() {
        const rootSizes = ['16px', '18px', '20.5px'];
        document.documentElement.style.fontSize = rootSizes[appState.fontScale] || '16px';
      }

      function renderFontScaleButtons(isDark = false) {
        const borderCls = isDark ? 'border-slate-700 bg-slate-800 text-slate-200' : 'border-slate-200 bg-white text-slate-700';
        return `
          <div class="inline-flex rounded-xl border ${borderCls} p-0.5" title="Dimensione testo di titoli e contenuti">
            ${['A', 'A+', 'A++'].map((lbl, idx) => `
              <button
                type="button"

                }"

      }

      function ensureQuizTimerLoop() {
        if (quizIntervalId) {
          clearInterval(quizIntervalId);
          quizIntervalId = null;
        }
        quizIntervalId = setInterval(() => {
          if (!appState.roomCode) return;
          if (appState.view !== 'editor' && appState.view !== 'stage') return;
          const room = store.rooms[appState.roomCode];
          if (!room) return;
          const slide = room.slides[room.activeSlideIndex];
          if (!slide || slide.type !== 'quiz') return;

          if (slide.status === 'running') {
            if (slide.timeLeft > 1) {
              store.updateRoom(room.code, (r) => {
                const s = r.slides[r.activeSlideIndex];
                if (s && s.type === 'quiz' && s.status === 'running') {
                  s.timeLeft = Math.max(0, s.timeLeft - 1);
                }
              });
            } else {
              store.updateRoom(room.code, (r) => {
                const s = r.slides[r.activeSlideIndex];
                if (s && s.type === 'quiz') {
                  s.timeLeft = 0;
                  s.status = 'ended';
                }
              });
              showToast('Tempo scaduto! Ecco i risultati del Quiz.', 'info');
            }
          }
        }, 1000);
      }

      // =========================================================================
      // 7. MOTORE WORD CLOUD (Spirale, Merge Drag&Drop/Touch e ResizeObserver)
      // =========================================================================
      let wcResizeObserver = null;

      function normalizeWordKey(raw) {
        return String(raw || '').trim().replace(/\s+/g, ' ').toLowerCase();
      }

      function resolveWordAlias(raw, aliases) {
        let current = String(raw || '').trim().replace(/\s+/g, ' ');
        if (!current) return '';
        if (!aliases) return current;
        const visited = new Set();
        while (true) {
          const k = normalizeWordKey(current);
          if (!aliases[k] || visited.has(k)) break;
          visited.add(k);
          current = aliases[k];
        }
        return current;
      }

      function computeWordFrequencies(slide) {
        const freq = new Map();
        const responses = slide.responses || {};
        const aliases = slide.wordAliases || {};
        Object.values(responses).forEach(entry => {
          const words = Array.isArray(entry) ? entry : [entry];
          words.forEach(raw => {
            const resolved = resolveWordAlias(raw, aliases);
            if (!resolved) return;
            const key = normalizeWordKey(resolved);
            if (!freq.has(key)) {
              freq.set(key, { key, label: resolved, count: 1 });
            } else {
              freq.get(key).count += 1;
            }
          });
        });
        return Array.from(freq.values()).sort((a, b) => b.count - a.count);
      }

      function mergeWordCloudTerms(sourceKey, sourceLabel, targetKey, targetLabel) {
        if (!sourceKey || !targetKey || sourceKey === targetKey) return;
        store.updateRoom(appState.roomCode, (r) => {
          const sl = r.slides[r.activeSlideIndex];
          if (!sl || sl.type !== 'wordcloud') return;
          if (!sl.wordAliases) sl.wordAliases = {};
          if (!sl.mergeHistory) sl.mergeHistory = [];
          sl.mergeHistory.push({
            prevAliases: { ...sl.wordAliases },
            sourceLabel,
            targetLabel
          });
          Object.keys(sl.wordAliases).forEach(k => {
            if (normalizeWordKey(sl.wordAliases[k]) === sourceKey) {
              sl.wordAliases[k] = targetLabel;
            }
          });
          sl.wordAliases[sourceKey] = targetLabel;
        });
        showToast(`Unito "${sourceLabel}" in "${targetLabel}"`, 'success');
      }

      function undoLastWordMerge() {
        store.updateRoom(appState.roomCode, (r) => {
          const sl = r.slides[r.activeSlideIndex];
          if (!sl || sl.type !== 'wordcloud' || !sl.mergeHistory || sl.mergeHistory.length === 0) return;
          const last = sl.mergeHistory.pop();
          sl.wordAliases = last.prevAliases || {};
        });
        showToast('Ultima unione annullata', 'info');
      }

      function layoutWordCloudContainers() {
        const containers = document.querySelectorAll('[data-wordcloud-canvas]');
        containers.forEach(container => {
          const rect = container.getBoundingClientRect();
          const width = rect.width;
          const height = rect.height;
          if (width < 60 || height < 60) return;

          const words = Array.from(container.querySelectorAll('.wc-word'));
          if (words.length === 0) return;

          const placed = [];
          const cx = width / 2;
          const cy = height / 2;

          words.forEach((el, idx) => {
            const w = el.offsetWidth + 14;
            const h = el.offsetHeight + 10;
            let angle = idx * 0.9;
            let radius = 0;
            let bestX = cx - w / 2;
            let bestY = cy - h / 2;
            let found = false;

            for (let step = 0; step < 480; step++) {
              const x = cx + radius * Math.cos(angle) * 1.28 - w / 2;
              const y = cy + radius * Math.sin(angle) * 0.86 - h / 2;

              if (x >= 8 && y >= 8 && x + w <= width - 8 && y + h <= height - 8) {
                const overlaps = placed.some(box => !(
                  x + w < box.x ||
                  x > box.x + box.w ||
                  y + h < box.y ||
                  y > box.y + box.h
                ));
                if (!overlaps) {
                  bestX = x;
                  bestY = y;
                  found = true;
                  break;
                }
              }
              angle += 0.35;
              radius += 1.45;
            }

            if (!found) {
              bestX = Math.max(8, Math.min(width - w - 8, cx - w / 2 + ((idx % 5) - 2) * 28));
              bestY = Math.max(8, Math.min(height - h - 8, cy - h / 2 + ((idx % 3) - 1) * 24));
            }

            placed.push({ x: bestX, y: bestY, w, h });
            el.style.left = `${Math.round(bestX + 7)}px`;
            el.style.top = `${Math.round(bestY + 5)}px`;
            el.style.opacity = '1';
          });
        });
      }

      function initWordCloudObserver() {
        if (wcResizeObserver) {
          wcResizeObserver.disconnect();
        }
        if ('ResizeObserver' in window) {
          wcResizeObserver = new ResizeObserver(() => {
            requestAnimationFrame(layoutWordCloudContainers);
          });
          document.querySelectorAll('[data-wordcloud-canvas]').forEach(el => {
            wcResizeObserver.observe(el);
          });
        }
        requestAnimationFrame(layoutWordCloudContainers);
      }

      // =========================================================================
      // 8. RENDERING DEI GRAFICI SUL PALCO / LIM (Stage View)
      // =========================================================================
      function getFontScaleClasses() {
        if (appState.fontScale === 2) {
          return { title: 'text-3xl sm:text-5xl', sub: 'text-xl sm:text-2xl', body: 'text-xl sm:text-2xl' };
        }
        if (appState.fontScale === 1) {
          return { title: 'text-2xl sm:text-4xl', sub: 'text-lg sm:text-xl', body: 'text-lg sm:text-xl' };
        }
        return { title: 'text-xl sm:text-3xl', sub: 'text-base sm:text-lg', body: 'text-base sm:text-lg' };
      }

      function renderStageSlideContent(room, slide, isCompactPreview = false) {
        const theme = THEMES[room.theme] || THEMES.cream;
        const fScale = getFontScaleClasses();
        const responsesCount = slide.responses ? Object.keys(slide.responses).length : 0;

        let visualHtml = '';

        if (slide.type === 'wordcloud') {
          const items = computeWordFrequencies(slide);
          const maxCount = items.length > 0 ? items[0].count : 1;
          const minCount = items.length > 0 ? items[items.length - 1].count : 1;

          if (items.length === 0) {
            visualHtml = `
              <div class="flex-1 flex flex-col items-center justify-center text-center py-12 px-4">
                <div class="w-20 h-20 rounded-3xl bg-orange-100 text-[#FF5A36] flex items-center justify-center mb-4">
                  ${getIcon('wordcloud', 'w-10 h-10')}
                </div>
                <p class="font-display font-bold text-xl ${theme.textPrimary}">In attesa delle parole degli studenti...</p>
                <p class="text-sm ${theme.textSecondary} mt-1">Appena inviano una parola dal telefono apparirà qui al centro!</p>
              </div>
            `;
          } else {
            const scaleMult = appState.fontScale === 2 ? 1.22 : appState.fontScale === 1 ? 1.1 : 1;
            const wordsHtml = items.map((item, idx) => {
              const ratio = maxCount === minCount ? 0.65 : (item.count - minCount) / (maxCount - minCount);
              const minPx = Math.round((isCompactPreview ? 18 : 22) * scaleMult);
              const maxPx = Math.round((isCompactPreview ? 50 : 68) * scaleMult);
              const fontSize = Math.round(minPx + ratio * (maxPx - minPx));
              const color = CHART_PALETTE[idx % CHART_PALETTE.length];
              const tilt = idx % 5 === 0 ? '-3deg' : (idx % 4 === 0 ? '3deg' : '0deg');
              return `
                <span
                  draggable="true"
                  data-wc-key="${escapeHTML(item.key)}"
                  data-wc-label="${escapeHTML(item.label)}"
                  class="wc-word absolute font-display font-extrabold leading-none tracking-tight px-2 py-1 rounded-xl opacity-0 inline-flex items-baseline gap-1"
                  style="font-size: ${fontSize}px; color: ${color}; transform: rotate(${tilt});"
                  title="Trascina sopra un'altra parola simile per unirle (${item.count} ${item.count === 1 ? 'voto' : 'voti'})"
                >
                  <span>${escapeHTML(item.label)}</span>${item.count > 1 ? `<sup class="text-[0.38em] font-black opacity-75">${item.count}</sup>` : ''}
                </span>
              `;
            }).join('');

            const mergeCount = (slide.mergeHistory || []).length;
            const mergeBarHtml = `
              <div class="flex flex-wrap items-center justify-between gap-2 mb-2 px-1">
                <span class="text-xs font-semibold ${theme.textSecondary}">
                  💡 Trascina una parola sopra un'altra simile per unirle
                </span>
                ${mergeCount > 0 ? `
                  <button
                    type="button"
                    data-action="undo-wc-merge"
                    class="px-2.5 py-1 rounded-xl border ${theme.pillBg} text-xs font-extrabold hover:opacity-80 transition"
                  >↩ Annulla unione (${mergeCount})</button>
                ` : ''}
              </div>
            `;

            visualHtml = `
              ${mergeBarHtml}
              <div data-wordcloud-canvas class="relative w-full flex-1 min-h-[290px] sm:min-h-[370px] overflow-hidden select-none">
                ${wordsHtml}
              </div>
            `;
          }
        } else if (slide.type === 'multiple_choice') {
          const options = slide.options || [];
          const counts = {};
          options.forEach(o => { counts[o.id] = 0; });
          Object.values(slide.responses || {}).forEach(optId => {
            if (counts[optId] !== undefined) counts[optId] += 1;
          });
          const totalVotes = Object.values(counts).reduce((a, b) => a + b, 0);
          const chartType = slide.chartType || 'bar';

          const switcherHtml = `
            <div class="flex items-center justify-end gap-1.5 mb-4">
              <span class="text-xs font-bold uppercase tracking-wider ${theme.textSecondary} mr-1">Grafico:</span>
              ${[
                { id: 'bar', label: 'Barre' },
                { id: 'donut', label: 'Ciambella' },
                { id: 'pie', label: 'Torta' }
              ].map(ct => `
                <button
                  type="button"
                  data-action="set-chart-type"
                  data-chart="${ct.id}"
                  class="px-3 py-1.5 rounded-xl text-xs font-bold transition ${
                    chartType === ct.id
                      ? 'bg-[#FF5A36] text-white shadow-sm'
                      : `${theme.pillBg} border hover:opacity-80`
                  }"
                >${ct.label}</button>
              `).join('')}
            </div>
          `;

          if (chartType === 'bar') {
            const barsHtml = options.map((opt, idx) => {
              const count = counts[opt.id] || 0;
              const pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
              const color = CHART_PALETTE[idx % CHART_PALETTE.length];
              return `
                <div class="space-y-1.5">
                  <div class="flex items-center justify-between gap-3 ${fScale.body} font-bold ${theme.textPrimary}">
                    <div class="flex items-center gap-2.5 min-w-0">
                      <span class="w-7 h-7 rounded-lg text-white text-xs font-extrabold flex items-center justify-center shrink-0" style="background:${color}">
                        ${String.fromCharCode(65 + idx)}
                      </span>
                      <span class="truncate">${escapeHTML(opt.text)}</span>
                    </div>
                    <span class="shrink-0 font-display text-lg" style="color:${color}">
                      ${count} <span class="text-xs font-sans font-semibold ${theme.textSecondary}">(${pct}%)</span>
                    </span>
                  </div>
                  <div class="w-full h-5 rounded-full ${theme.barTrack} overflow-hidden p-0.5">
                    <div
                      class="h-full rounded-full transition-all duration-500 ease-out"
                      style="width: ${pct}%; background-color: ${color}; min-width: ${count > 0 ? '14px' : '0px'};"
                    ></div>
                  </div>
                </div>
              `;
            }).join('');

            visualHtml = `${switcherHtml}<div class="space-y-4 my-auto">${barsHtml}</div>`;
          } else {
            const radius = 92;
            const cx = 120;
            const cy = 120;
            let currentAngle = -Math.PI / 2;
            let svgPaths = '';

            if (totalVotes === 0) {
              svgPaths = `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="#CBD5E1" stroke-width="24" stroke-dasharray="8 8" />`;
            } else {
              options.forEach((opt, idx) => {
                const count = counts[opt.id] || 0;
                if (count === 0) return;
                const color = CHART_PALETTE[idx % CHART_PALETTE.length];
                const fraction = count / totalVotes;
                if (fraction >= 0.999) {
                  svgPaths += `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="${color}" />`;
                } else {
                  const sliceAngle = fraction * Math.PI * 2;
                  const x1 = cx + radius * Math.cos(currentAngle);
                  const y1 = cy + radius * Math.sin(currentAngle);
                  const x2 = cx + radius * Math.cos(currentAngle + sliceAngle);
                  const y2 = cy + radius * Math.sin(currentAngle + sliceAngle);
                  const largeArc = sliceAngle > Math.PI ? 1 : 0;
                  svgPaths += `<path d="M ${cx} ${cy} L ${x1.toFixed(2)} ${y1.toFixed(2)} A ${radius} ${radius} 0 ${largeArc} 1 ${x2.toFixed(2)} ${y2.toFixed(2)} Z" fill="${color}" stroke="${theme.isDark ? '#1E293B' : '#FFFFFF'}" stroke-width="2.5" />`;
                  currentAngle += sliceAngle;
                }
              });
            }

            if (chartType === 'donut') {
              svgPaths += `<circle cx="${cx}" cy="${cy}" r="50" fill="${theme.isDark ? '#1E293B' : '#FFFFFF'}" />`;
              svgPaths += `<text x="${cx}" y="${cy - 4}" text-anchor="middle" fill="${theme.isDark ? '#FFFFFF' : '#0F172A'}" font-family="Outfit, sans-serif" font-weight="800" font-size="24">${totalVotes}</text>`;
              svgPaths += `<text x="${cx}" y="${cy + 16}" text-anchor="middle" fill="#64748B" font-family="DM Sans, sans-serif" font-weight="700" font-size="11">${totalVotes === 1 ? 'VOTO' : 'VOTI'}</text>`;
            }

            const legendHtml = options.map((opt, idx) => {
              const count = counts[opt.id] || 0;
              const pct = totalVotes > 0 ? Math.round((count / totalVotes) * 100) : 0;
              const color = CHART_PALETTE[idx % CHART_PALETTE.length];
              return `
                <div class="flex items-center justify-between gap-3 p-2.5 rounded-2xl border ${theme.isDark ? 'border-slate-700 bg-slate-800/70' : 'border-slate-100 bg-slate-50/90'}">
                  <div class="flex items-center gap-2.5 min-w-0">
                    <span class="w-4 h-4 rounded-md shrink-0" style="background:${color}"></span>
                    <span class="font-bold text-sm sm:text-base ${theme.textPrimary} truncate">${escapeHTML(opt.text)}</span>
                  </div>
                  <span class="font-display font-extrabold text-base shrink-0" style="color:${color}">${pct}% <span class="text-xs font-sans ${theme.textSecondary}">(${count})</span></span>
                </div>
              `;
            }).join('');

            visualHtml = `
              ${switcherHtml}
              <div class="grid grid-cols-1 md:grid-cols-2 gap-6 items-center my-auto">
                <div class="flex items-center justify-center">
                  <svg viewBox="0 0 240 240" class="w-52 h-52 sm:w-64 sm:h-64 drop-shadow-sm">${svgPaths}</svg>
                </div>
                <div class="space-y-2.5">${legendHtml}</div>
              </div>
            `;
          }
        } else if (slide.type === 'scales') {
          const statements = slide.statements || [];
          const allResponses = Object.values(slide.responses || {});

          const rowsHtml = statements.map((st, idx) => {
            const values = allResponses
              .map(r => (r && typeof r[st.id] === 'number' ? r[st.id] : null))
              .filter(v => v !== null);
            const avg = values.length > 0 ? (values.reduce((a, b) => a + b, 0) / values.length) : 0;
            const pct = avg > 0 ? ((avg - 1) / 4) * 100 : 0;
            const color = CHART_PALETTE[idx % CHART_PALETTE.length];
            const dist = [1, 2, 3, 4, 5].map(score => values.filter(v => v === score).length);

            return `
              <div class="p-4 rounded-2xl border ${theme.isDark ? 'border-slate-700 bg-slate-800/70' : 'border-slate-200/80 bg-slate-50/70'} space-y-2.5">
                <div class="flex items-center justify-between gap-3">
                  <span class="font-bold ${fScale.body} ${theme.textPrimary}">${escapeHTML(st.text)}</span>
                  <div class="flex items-center gap-2 shrink-0">
                    <span class="px-3 py-1 rounded-xl text-white font-display font-extrabold text-lg" style="background:${color}">
                      ${avg > 0 ? avg.toFixed(1) : '—'} <span class="text-xs font-normal opacity-90">/ 5</span>
                    </span>
                  </div>
                </div>
                <div class="relative w-full h-4 rounded-full ${theme.barTrack} overflow-visible">
                  <div class="h-full rounded-full transition-all duration-500" style="width:${pct}%; background:${color}"></div>
                  ${avg > 0 ? `<div class="absolute top-1/2 -translate-y-1/2 -translate-x-1/2 w-6 h-6 rounded-full bg-white border-4 shadow-md transition-all duration-500" style="left:${pct}%; border-color:${color}"></div>` : ''}
                </div>
                <div class="flex items-center justify-between text-xs font-semibold ${theme.textSecondary} pt-1">
                  <span>Distribuzione voti:</span>
                  <div class="flex items-center gap-2">
                    ${dist.map((cnt, i) => `<span class="px-2 py-0.5 rounded-md ${theme.pillBg} border">★${i + 1}: <b>${cnt}</b></span>`).join('')}
                  </div>
                </div>
              </div>
            `;
          }).join('');

          visualHtml = `
            <div class="flex items-center justify-between text-xs font-bold ${theme.textSecondary} mb-3 px-1">
              <span>${escapeHTML(slide.minLabel || '1 • Minimo')}</span>
              <span>${escapeHTML(slide.maxLabel || '5 • Massimo')}</span>
            </div>
            <div class="space-y-3.5 my-auto">${rowsHtml}</div>
          `;
        } else if (slide.type === 'ranking') {
          const items = slide.items || [];
          const n = items.length;
          const scores = {};
          items.forEach(it => { scores[it.id] = 0; });

          Object.values(slide.responses || {}).forEach(orderArr => {
            if (!Array.isArray(orderArr)) return;
            orderArr.forEach((itemId, rankIdx) => {
              if (scores[itemId] !== undefined) {
                scores[itemId] += Math.max(1, n - rankIdx);
              }
            });
          });

          const sorted = [...items].sort((a, b) => (scores[b.id] || 0) - (scores[a.id] || 0));
          const maxScore = sorted.length > 0 ? Math.max(1, scores[sorted[0].id] || 1) : 1;

          const rankHtml = sorted.map((it, idx) => {
            const sc = scores[it.id] || 0;
            const widthPct = sc > 0 ? Math.round((sc / maxScore) * 100) : 0;
            const medalBg = idx === 0
              ? 'bg-amber-400 text-slate-950'
              : idx === 1
                ? 'bg-slate-300 text-slate-900'
                : idx === 2
                  ? 'bg-orange-300 text-slate-950'
                  : 'bg-slate-200 text-slate-700';

            return `
              <div class="flex items-center gap-3.5 p-3 rounded-2xl border ${theme.isDark ? 'border-slate-700 bg-slate-800/70' : 'border-slate-200/80 bg-white'}">
                <div class="w-10 h-10 rounded-xl ${medalBg} font-display font-black text-lg flex items-center justify-center shrink-0 shadow-sm">
                  ${idx + 1}°
                </div>
                <div class="flex-1 min-w-0">
                  <div class="flex items-center justify-between gap-2 mb-1.5">
                    <span class="font-bold ${fScale.body} ${theme.textPrimary} truncate">${escapeHTML(it.text)}</span>
                    <span class="text-xs font-extrabold px-2.5 py-0.5 rounded-lg bg-amber-100 text-amber-900 shrink-0">${sc} pt</span>
                  </div>
                  <div class="w-full h-2.5 rounded-full ${theme.barTrack} overflow-hidden">
                    <div class="h-full rounded-full bg-amber-500 transition-all duration-500" style="width:${widthPct}%"></div>
                  </div>
                </div>
              </div>
            `;
          }).join('');

          visualHtml = `<div class="space-y-3 my-auto">${rankHtml}</div>`;
        } else if (slide.type === 'open_ended') {
          const entries = Object.entries(slide.responses || {});
          const noteColors = [
            'border-t-4 border-t-[#FF5A36] bg-orange-50/70',
            'border-t-4 border-t-blue-500 bg-blue-50/70',
            'border-t-4 border-t-emerald-500 bg-emerald-50/70',
            'border-t-4 border-t-amber-400 bg-amber-50/70',
            'border-t-4 border-t-cyan-500 bg-cyan-50/70'
          ];

          if (entries.length === 0) {
            visualHtml = `
              <div class="flex-1 flex flex-col items-center justify-center text-center py-12">
                <div class="w-20 h-20 rounded-3xl bg-cyan-100 text-cyan-600 flex items-center justify-center mb-4">
                  ${getIcon('open_ended', 'w-10 h-10')}
                </div>
                <p class="font-display font-bold text-xl ${theme.textPrimary}">Bacheca pronta per i messaggi della classe</p>
                <p class="text-sm ${theme.textSecondary} mt-1">Clicca su un bigliettino quando appare per ingrandirlo a tutto schermo.</p>
              </div>
            `;
          } else {
            const cardsHtml = entries.map(([pid, entry], idx) => {
              const text = typeof entry === 'string' ? entry : (entry && entry.text) || '';
              const author = typeof entry === 'object' && entry && entry.author ? entry.author : 'Studente';
              const colorCls = theme.isDark
                ? 'border-t-4 border-t-[#FF5A36] bg-slate-800 text-white border border-slate-700'
                : `${noteColors[idx % noteColors.length]} text-slate-900 border border-slate-200/80`;
              return `
                <button
                  type="button"
                  data-action="open-spotlight"
                  data-text="${escapeHTML(text)}"
                  data-author="${escapeHTML(author)}"
                  class="text-left p-4 rounded-2xl shadow-card hover:-translate-y-1 transition-all flex flex-col justify-between min-h-[120px] ${colorCls}"
                >
                  <p class="font-medium ${fScale.body} leading-snug line-clamp-4">“${escapeHTML(text)}”</p>
                  <div class="flex items-center justify-between mt-3 pt-2 border-t border-black/5 text-xs font-bold opacity-70">
                    <span>${escapeHTML(author)}</span>
                    <span>Ingrandisci ↗</span>
                  </div>
                </button>
              `;
            }).join('');

            visualHtml = `
              <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3.5 overflow-y-auto max-h-[420px] pr-1 my-auto">
                ${cardsHtml}
              </div>
            `;
          }
        } else if (slide.type === 'quiz') {
          const status = slide.status || 'waiting';
          const timeLeft = typeof slide.timeLeft === 'number' ? slide.timeLeft : (slide.duration || 25);
          const options = slide.options || [];
          const counts = {};
          options.forEach(o => { counts[o.id] = 0; });
          Object.values(slide.responses || {}).forEach(resp => {
            if (resp && resp.optionId && counts[resp.optionId] !== undefined) {
              counts[resp.optionId] += 1;
            }
          });

          const controlsHtml = `
            <div class="flex flex-wrap items-center justify-between gap-3 p-3.5 rounded-2xl border ${theme.isDark ? 'border-slate-700 bg-slate-800/80' : 'border-slate-200 bg-slate-50'} mb-4">
              <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-2xl flex items-center justify-center font-display font-black text-xl ${
                  status === 'running'
                    ? (timeLeft <= 5 ? 'bg-rose-600 text-white animate-pulse' : 'bg-[#FF5A36] text-white')
                    : 'bg-slate-900 text-white'
                }">
                  ${timeLeft}s
                </div>
                <div>
                  <div class="text-xs font-extrabold uppercase tracking-wider ${theme.textSecondary}">
                    ${status === 'waiting' ? 'Pronto per partire' : status === 'running' ? 'Quiz in corso!' : status === 'paused' ? 'In pausa (lettura)' : 'Tempo scaduto • Soluzione'}
                  </div>
                  <div class="text-sm font-bold ${theme.textPrimary}">
                    ${responsesCount} ${responsesCount === 1 ? 'risposta ricevuta' : 'risposte ricevute'}
                  </div>
                </div>
              </div>

              <div class="flex flex-wrap items-center gap-2">
                ${status === 'waiting' ? `
                  <button type="button" data-action="quiz-start" class="btn-tactile px-4 py-2 rounded-xl bg-emerald-600 text-white font-bold text-sm flex items-center gap-1.5">
                    ${getIcon('play', 'w-4 h-4')} Avvia Quiz
                  </button>
                ` : ''}
                ${status === 'running' ? `
                  <button type="button" data-action="quiz-pause" class="btn-tactile px-3.5 py-2 rounded-xl bg-amber-400 text-slate-950 font-bold text-sm">
                    ⏸ Pausa
                  </button>
                  <button type="button" data-action="quiz-end" class="btn-tactile px-3.5 py-2 rounded-xl bg-blue-600 text-white font-bold text-sm">
                    ✓ Mostra Soluzione
                  </button>
                ` : ''}
                ${status === 'paused' ? `
                  <button type="button" data-action="quiz-resume" class="btn-tactile px-4 py-2 rounded-xl bg-emerald-600 text-white font-bold text-sm flex items-center gap-1.5">
                    ${getIcon('play', 'w-4 h-4')} Riprendi
                  </button>
                  <button type="button" data-action="quiz-end" class="btn-tactile px-3.5 py-2 rounded-xl bg-blue-600 text-white font-bold text-sm">
                    ✓ Mostra Soluzione
                  </button>
                ` : ''}
                ${status !== 'waiting' ? `
                  <button type="button" data-action="quiz-reset" class="px-3 py-2 rounded-xl border ${theme.pillBg} font-bold text-xs hover:opacity-80">
                    ↻ Ricomincia
                  </button>
                ` : ''}
              </div>
            </div>
          `;

          const optionsGridHtml = options.map((opt, idx) => {
            const color = CHART_PALETTE[idx % CHART_PALETTE.length];
            const count = counts[opt.id] || 0;
            const showResult = status === 'ended';
            const cardBorder = showResult
              ? (opt.isCorrect
                  ? 'border-emerald-500 ring-4 ring-emerald-500/20 bg-emerald-50/90 text-slate-900'
                  : 'opacity-50 border-slate-200 bg-slate-100/70 text-slate-600')
              : (theme.isDark ? 'border-slate-700 bg-slate-800/80 text-white' : 'border-slate-200 bg-white text-slate-900');

            return `
              <div class="p-4 rounded-2xl border-2 transition-all flex items-center justify-between gap-3 ${cardBorder}">
                <div class="flex items-center gap-3 min-w-0">
                  <span class="w-9 h-9 rounded-xl text-white font-display font-black text-base flex items-center justify-center shrink-0" style="background:${color}">
                    ${String.fromCharCode(65 + idx)}
                  </span>
                  <span class="font-bold ${fScale.body} leading-snug">${escapeHTML(opt.text)}</span>
                </div>
                <div class="flex items-center gap-2 shrink-0">
                  ${showResult && opt.isCorrect ? `<span class="px-2.5 py-1 rounded-lg bg-emerald-600 text-white text-xs font-extrabold">✓ Corretta</span>` : ''}
                  ${showResult ? `<span class="font-display font-black text-lg text-slate-800">${count}</span>` : ''}
                </div>
              </div>
            `;
          }).join('');

          visualHtml = `${controlsHtml}<div class="grid grid-cols-1 sm:grid-cols-2 gap-3.5 my-auto">${optionsGridHtml}</div>`;
        } else if (slide.type === 'leaderboard') {
          const totals = {};
          (room.slides || []).forEach(sl => {
            if (sl.type !== 'quiz' || !sl.responses) return;
            Object.entries(sl.responses).forEach(([pid, resp]) => {
              if (!resp) return;
              if (!totals[pid]) {
                const simFound = SIMULATED_STUDENTS.find(s => s.id === pid);
                totals[pid] = {
                  id: pid,
                  name: resp.name || (simFound ? simFound.name : 'Studente'),
                  points: 0
                };
              }
              totals[pid].points += Number(resp.points || 0);
            });
          });

          const ranking = Object.values(totals).sort((a, b) => b.points - a.points).slice(0, 5);

          if (ranking.length === 0) {
            visualHtml = `
              <div class="flex-1 flex flex-col items-center justify-center text-center py-12">
                <div class="w-20 h-20 rounded-3xl bg-yellow-100 text-yellow-600 flex items-center justify-center mb-4">
                  ${getIcon('leaderboard', 'w-10 h-10')}
                </div>
                <p class="font-display font-bold text-xl ${theme.textPrimary}">Nessun punteggio ancora registrato</p>
                <p class="text-sm ${theme.textSecondary} mt-1">Avvia prima una slide Quiz per popolare il podio della classe!</p>
              </div>
            `;
          } else {
            const first = ranking[0];
            const second = ranking[1];
            const third = ranking[2];
            const rest = ranking.slice(3);

            const confettiHtml = Array.from({ length: 18 }).map((_, i) => {
              const left = 5 + ((i * 5.3) % 90);
              const delay = (i % 6) * 0.25;
              const col = CHART_PALETTE[i % CHART_PALETTE.length];
              return `<span class="confetti-piece" style="left:${left}%; animation-delay:${delay}s; background:${col}"></span>`;
            }).join('');

            visualHtml = `
              <div class="relative overflow-hidden py-2 my-auto">
                ${confettiHtml}
                <div class="flex items-end justify-center gap-3 sm:gap-5 max-w-xl mx-auto pt-6 pb-4">
                  <!-- 2° Posto -->
                  <div class="flex-1 flex flex-col items-center">
                    ${second ? `
                      <div class="text-center mb-2">
                        <div class="font-display font-extrabold text-sm sm:text-base ${theme.textPrimary} truncate max-w-[110px]">${escapeHTML(second.name)}</div>
                        <div class="text-xs font-extrabold text-slate-500">${second.points} pt</div>
                      </div>
                      <div class="w-full h-24 sm:h-28 rounded-t-2xl bg-slate-300 border-t-4 border-slate-400 flex flex-col items-center justify-center shadow-md">
                        <span class="font-display font-black text-3xl text-slate-800">2°</span>
                      </div>
                    ` : '<div class="w-full h-24"></div>'}
                  </div>

                  <!-- 1° Posto -->
                  <div class="flex-1 flex flex-col items-center">
                    ${first ? `
                      <div class="text-center mb-2">
                        <div class="text-2xl mb-0.5">👑</div>
                        <div class="font-display font-black text-base sm:text-xl ${theme.textPrimary} truncate max-w-[130px]">${escapeHTML(first.name)}</div>
                        <div class="text-xs font-extrabold px-2.5 py-0.5 rounded-full bg-amber-300 text-slate-950 inline-block mt-0.5">${first.points} pt</div>
                      </div>
                      <div class="w-full h-36 sm:h-40 rounded-t-2xl bg-gradient-to-b from-amber-300 to-amber-400 border-t-4 border-amber-500 flex flex-col items-center justify-center shadow-lg">
                        <span class="font-display font-black text-4xl text-slate-950">1°</span>
                      </div>
                    ` : ''}
                  </div>

                  <!-- 3° Posto -->
                  <div class="flex-1 flex flex-col items-center">
                    ${third ? `
                      <div class="text-center mb-2">
                        <div class="font-display font-extrabold text-sm sm:text-base ${theme.textPrimary} truncate max-w-[110px]">${escapeHTML(third.name)}</div>
                        <div class="text-xs font-extrabold text-orange-600">${third.points} pt</div>
                      </div>
                      <div class="w-full h-20 sm:h-24 rounded-t-2xl bg-orange-300 border-t-4 border-orange-400 flex flex-col items-center justify-center shadow-md">
                        <span class="font-display font-black text-3xl text-slate-900">3°</span>
                      </div>
                    ` : '<div class="w-full h-20"></div>'}
                  </div>
                </div>

                ${rest.length > 0 ? `
                  <div class="max-w-md mx-auto space-y-2 mt-2">
                    ${rest.map((item, idx) => `
                      <div class="flex items-center justify-between px-4 py-2 rounded-xl border ${theme.pillBg}">
                        <span class="font-bold text-sm"><b class="mr-2">${idx + 4}°</b> ${escapeHTML(item.name)}</span>
                        <span class="font-display font-extrabold text-sm">${item.points} pt</span>
                      </div>
                    `).join('')}
                  </div>
                ` : ''}
              </div>
            `;
          }
        }

        const typeMeta = SLIDE_TYPES[slide.type] || SLIDE_TYPES.multiple_choice;

        return `
          <div class="w-full h-full rounded-3xl border p-5 sm:p-8 flex flex-col justify-between transition-colors ${theme.cardBg}">
            <!-- Intestazione Domanda -->
            <div class="mb-4">
              <div class="flex flex-wrap items-center justify-between gap-2 mb-2.5">
                <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl border text-xs font-extrabold uppercase tracking-wider ${typeMeta.badgeBg}">
                  ${getIcon(slide.type, 'w-3.5 h-3.5')}
                  ${typeMeta.label}
                </span>
                ${slide.type !== 'leaderboard' ? `
                  <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-xl border text-xs font-bold ${theme.pillBg}">
                    ${getIcon('users', 'w-3.5 h-3.5')}
                    ${responsesCount} ${responsesCount === 1 ? 'partecipante' : 'partecipanti'}
                  </span>
                ` : ''}
              </div>
              <h2 class="font-display font-black ${fScale.title} leading-tight ${theme.textPrimary}">
                ${escapeHTML(slide.question)}
              </h2>
              ${slide.subtitle ? `<p class="${fScale.sub} ${theme.textSecondary} mt-1.5 font-medium">${escapeHTML(slide.subtitle)}</p>` : ''}
            </div>

            <!-- Area Visualizzazione Grafica -->
            <div class="flex-1 flex flex-col justify-center min-h-0">
              ${visualHtml}
            </div>
          </div>
        `;
      }

      // =========================================================================
      // 9. RENDERING INTERFACCIA SMARTPHONE STUDENTE (Reale & Telefono Test)
      // =========================================================================
      function renderStudentSlideForm(room, slide, participantId, participantName, isSimulator = false) {
        const draftKey = `${room.code}_${slide.id}_${participantId}`;
        const existingResp = slide.responses ? slide.responses[participantId] : undefined;
        const sizeCls = appState.fontScale === 2 ? 'text-xl' : appState.fontScale === 1 ? 'text-lg' : 'text-base';

        let formHtml = '';

        if (slide.type === 'wordcloud') {
          const maxWords = slide.maxWords || 3;
          const draftWords = appState.drafts[draftKey] || Array.from({ length: maxWords }, (_, i) => (Array.isArray(existingResp) ? (existingResp[i] || '') : ''));
          const inputs = Array.from({ length: maxWords }).map((_, i) => `
            <input
              type="text"
              maxlength="28"
              placeholder="Parola ${i + 1}${i === 0 ? ' (obbligatoria)' : ' (facoltativa)'}"
              value="${escapeHTML(draftWords[i] || '')}"
              data-draft-key="${escapeHTML(draftKey)}"
              data-word-index="${i}"
              class="w-full px-4 py-3.5 rounded-2xl border-2 border-slate-200 focus:border-[#FF5A36] focus:outline-none font-bold text-slate-900 bg-white ${sizeCls}"
            />
          `).join('');

          formHtml = `
            <form data-action="submit-wordcloud" data-slide-id="${escapeHTML(slide.id)}" data-sim="${isSimulator}" class="space-y-3">
              ${inputs}
              <button type="submit" class="btn-tactile w-full py-3.5 rounded-2xl bg-[#FF5A36] text-white font-display font-extrabold text-base">
                ${existingResp ? 'Aggiorna le tue parole ✓' : 'Invia alla LIM 🚀'}
              </button>
            </form>
          `;
        } else if (slide.type === 'multiple_choice') {
          const options = slide.options || [];
          formHtml = `
            <div class="space-y-2.5">
              ${options.map((opt, idx) => {
                const selected = existingResp === opt.id;
                const color = CHART_PALETTE[idx % CHART_PALETTE.length];
                return `
                  <button
                    type="button"
                    data-action="vote-mc"
                    data-slide-id="${escapeHTML(slide.id)}"
                    data-option-id="${escapeHTML(opt.id)}"
                    data-sim="${isSimulator}"
                    class="btn-tactile w-full p-3.5 rounded-2xl border-2 text-left flex items-center gap-3 transition ${
                      selected
                        ? 'border-slate-900 bg-amber-100/90 text-slate-950'
                        : 'border-slate-200 bg-white hover:border-slate-400 text-slate-800'
                    }"
                  >
                    <span class="w-8 h-8 rounded-xl text-white font-display font-black text-sm flex items-center justify-center shrink-0" style="background:${color}">
                      ${String.fromCharCode(65 + idx)}
                    </span>
                    <span class="font-bold ${sizeCls} flex-1 leading-snug">${escapeHTML(opt.text)}</span>
                    ${selected ? `<span class="text-emerald-600 font-black text-lg">✓</span>` : ''}
                  </button>
                `;
              }).join('')}
            </div>
          `;
        } else if (slide.type === 'scales') {
          const statements = slide.statements || [];
          if (!appState.drafts[draftKey]) {
            const initObj = {};
            statements.forEach(st => {
              initObj[st.id] = existingResp && typeof existingResp[st.id] === 'number' ? existingResp[st.id] : 3;
            });
            appState.drafts[draftKey] = initObj;
          }
          const currentVals = appState.drafts[draftKey];

          formHtml = `
            <form data-action="submit-scales" data-slide-id="${escapeHTML(slide.id)}" data-sim="${isSimulator}" class="space-y-4">
              ${statements.map((st) => {
                const val = currentVals[st.id] || 3;
                return `
                  <div class="p-3.5 rounded-2xl bg-white border-2 border-slate-200 space-y-2.5">
                    <div class="flex items-start justify-between gap-2">
                      <span class="font-bold text-sm text-slate-800 leading-snug">${escapeHTML(st.text)}</span>
                      <span data-scale-badge="${escapeHTML(draftKey)}_${escapeHTML(st.id)}" class="px-2.5 py-0.5 rounded-xl bg-[#FF5A36] text-white font-display font-black text-base shrink-0">
                        ${val}
                      </span>
                    </div>
                    <input
                      type="range"
                      min="1"
                      max="5"
                      step="1"
                      value="${val}"
                      data-action="change-scale-slider"
                      data-draft-key="${escapeHTML(draftKey)}"
                      data-stid="${escapeHTML(st.id)}"
                      class="aula-slider"
                    />
                    <div class="flex justify-between text-[11px] font-bold text-slate-400">
                      <span>1</span><span>2</span><span>3</span><span>4</span><span>5</span>
                    </div>
                  </div>
                `;
              }).join('')}
              <button type="submit" class="btn-tactile w-full py-3.5 rounded-2xl bg-emerald-600 text-white font-display font-extrabold text-base">
                ${existingResp ? 'Aggiorna Valutazione ✓' : 'Invia Valutazione ✓'}
              </button>
            </form>
          `;
        } else if (slide.type === 'ranking') {
          const items = slide.items || [];
          const validIds = items.map(i => i.id);
          if (!appState.drafts[draftKey]) {
            const base = Array.isArray(existingResp)
              ? existingResp.filter(id => validIds.includes(id))
              : [];
            validIds.forEach(id => { if (!base.includes(id)) base.push(id); });
            appState.drafts[draftKey] = base;
          } else {
            const cleaned = appState.drafts[draftKey].filter(id => validIds.includes(id));
            validIds.forEach(id => { if (!cleaned.includes(id)) cleaned.push(id); });
            appState.drafts[draftKey] = cleaned;
          }

          const order = appState.drafts[draftKey];
          formHtml = `
            <div class="space-y-2.5">
              ${order.map((itemId, idx) => {
                const item = items.find(i => i.id === itemId);
                if (!item) return '';
                return `
                  <div class="p-3 rounded-2xl bg-white border-2 border-slate-200 flex items-center gap-2.5">
                    <span class="w-8 h-8 rounded-xl bg-amber-400 text-slate-950 font-display font-black text-sm flex items-center justify-center shrink-0">
                      ${idx + 1}°
                    </span>
                    <span class="font-bold text-sm text-slate-800 flex-1 leading-snug">${escapeHTML(item.text)}</span>
                    <div class="flex flex-col gap-1 shrink-0">
                      <button
                        type="button"
                        data-action="rank-move"
                        data-draft-key="${escapeHTML(draftKey)}"
                        data-index="${idx}"
                        data-dir="-1"
                        ${idx === 0 ? 'disabled' : ''}
                        class="w-8 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 disabled:opacity-30 font-black text-xs text-slate-700"
                      >▲</button>
                      <button
                        type="button"
                        data-action="rank-move"
                        data-draft-key="${escapeHTML(draftKey)}"
                        data-index="${idx}"
                        data-dir="1"
                        ${idx === order.length - 1 ? 'disabled' : ''}
                        class="w-8 h-7 rounded-lg bg-slate-100 hover:bg-slate-200 disabled:opacity-30 font-black text-xs text-slate-700"
                      >▼</button>
                    </div>
                  </div>
                `;
              }).join('')}
              <button
                type="button"
                data-action="submit-ranking"
                data-slide-id="${escapeHTML(slide.id)}"
                data-draft-key="${escapeHTML(draftKey)}"
                data-sim="${isSimulator}"
                class="btn-tactile w-full py-3.5 mt-2 rounded-2xl bg-amber-400 text-slate-950 font-display font-extrabold text-base"
              >
                ${existingResp ? 'Aggiorna Classifica ✓' : 'Conferma Classifica ✓'}
              </button>
            </div>
          `;
        } else if (slide.type === 'open_ended') {
          const prevText = typeof existingResp === 'string' ? existingResp : (existingResp && existingResp.text) || '';
          const draftText = appState.drafts[draftKey] !== undefined ? appState.drafts[draftKey] : prevText;

          formHtml = `
            <form data-action="submit-open" data-slide-id="${escapeHTML(slide.id)}" data-sim="${isSimulator}" class="space-y-3">
              <textarea
                rows="4"
                maxlength="240"
                placeholder="Scrivi qui la tua risposta per la classe..."

              </button>
            </form>
          `;
        } else if (slide.type === 'quiz') {
          const status = slide.status || 'waiting';
          const options = slide.options || [];

          if (status === 'waiting') {
            formHtml = `
              <div class="p-6 rounded-3xl bg-white border-2 border-slate-200 text-center space-y-2">

            const chosenOpt = options.find(o => o.id === existingResp.optionId);
            if (status === 'ended') {
              formHtml = `
                <div class="p-6 rounded-3xl border-2 text-center space-y-2 ${
                  existingResp.isCorrect
                    ? 'bg-emerald-50 border-emerald-500 text-emerald-950'

            } else {
              formHtml = `
                <div class="p-6 rounded-3xl bg-blue-50 border-2 border-blue-300 text-center space-y-2">

                  <p class="font-display font-extrabold text-lg text-blue-950">Risposta registrata!</p>

                </div>
              `;
            }
          } else if (status === 'ended') {
            formHtml = `
              <div class="p-6 rounded-3xl bg-slate-100 border-2 border-slate-300 text-center space-y-2">
                <div class="text-4xl">⏰</div>
                <p class="font-display font-extrabold text-lg text-slate-900">Tempo scaduto!</p>
                <p class="text-sm text-slate-600">Guarda la soluzione corretta proiettata alla LIM.</p>
              </div>
            `;
          } else {
            formHtml = `
              <div class="space-y-2.5">
                <div class="flex items-center justify-between text-xs font-extrabold text-rose-600 px-1">
                  <span>${status === 'paused' ? '⏸ Tempo in pausa' : '⚡ Rispondi veloce!'}</span>
                  <span>${slide.timeLeft || 0}s rimasti</span>
                </div>
                ${options.map((opt, idx) => {
                  const color = CHART_PALETTE[idx % CHART_PALETTE.length];
                  return `
                    <button
                      type="button"
                      data-action="vote-quiz"
                      data-slide-id="${escapeHTML(slide.id)}"
                      data-option-id="${escapeHTML(opt.id)}"

                    </button>

                }).join('')}
              </div>
            `;
          }
        } else if (slide.type === 'leaderboard') {
          formHtml = `
            <div class="p-6 rounded-3xl bg-amber-50 border-2 border-amber-300 text-center space-y-2">
              <div class="text-4xl">🏆</div>
              <p class="font-display font-extrabold text-lg text-slate-900">Guarda il Podio alla LIM!</p>

            </div>

        return `
          <div class="space-y-4">
